<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="pgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#336791;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#264d73;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="workerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc"/>
  <rect width="800" height="500" fill="url(#grid)" opacity="0.5"/>
  
  <!-- PostgreSQL Container -->
  <g filter="url(#shadow)">
    <rect x="150" y="40" width="500" height="180" rx="12" fill="url(#pgGrad)"/>
    <rect x="150" y="40" width="500" height="40" rx="12" fill="#264d73"/>
    <rect x="150" y="68" width="500" height="12" fill="#264d73"/>
  </g>
  
  <!-- PostgreSQL Label -->
  <text x="400" y="68" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">PostgreSQL</text>
  
  <!-- Database Tables -->
  <g>
    <!-- jobs table -->
    <rect x="175" y="100" width="110" height="50" rx="6" fill="white" opacity="0.95"/>
    <text x="230" y="130" text-anchor="middle" fill="#1e293b" font-family="ui-monospace, monospace" font-size="13" font-weight="500">jobs</text>
    
    <!-- job_executions table -->
    <rect x="305" y="100" width="130" height="50" rx="6" fill="white" opacity="0.95"/>
    <text x="370" y="130" text-anchor="middle" fill="#1e293b" font-family="ui-monospace, monospace" font-size="13" font-weight="500">job_executions</text>
    
    <!-- worker_heartbeats table -->
    <rect x="175" y="165" width="145" height="50" rx="6" fill="white" opacity="0.95"/>
    <text x="247" y="195" text-anchor="middle" fill="#1e293b" font-family="ui-monospace, monospace" font-size="13" font-weight="500">worker_heartbeats</text>
    
    <!-- dead_letter_jobs table -->
    <rect x="340" y="165" width="120" height="50" rx="6" fill="white" opacity="0.95"/>
    <text x="400" y="195" text-anchor="middle" fill="#1e293b" font-family="ui-monospace, monospace" font-size="13" font-weight="500">dead_letter</text>
  </g>
  
  <!-- Key icon for SKIP LOCKED -->
  <g transform="translate(480, 100)">
    <rect width="150" height="115" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="75" y="30" text-anchor="middle" fill="#92400e" font-family="system-ui, sans-serif" font-size="11" font-weight="600">KEY FEATURE</text>
    <text x="75" y="55" text-anchor="middle" fill="#78350f" font-family="ui-monospace, monospace" font-size="11">SELECT FOR</text>
    <text x="75" y="72" text-anchor="middle" fill="#78350f" font-family="ui-monospace, monospace" font-size="11">UPDATE</text>
    <text x="75" y="95" text-anchor="middle" fill="#78350f" font-family="ui-monospace, monospace" font-size="13" font-weight="700">SKIP LOCKED</text>
  </g>
  
  <!-- Connection lines to workers -->
  <path d="M 400 220 L 400 280" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6,4"/>
  <path d="M 400 280 L 170 330" stroke="#94a3b8" stroke-width="3"/>
  <path d="M 400 280 L 400 330" stroke="#94a3b8" stroke-width="3"/>
  <path d="M 400 280 L 630 330" stroke="#94a3b8" stroke-width="3"/>
  
  <!-- Arrow heads -->
  <polygon points="170,330 178,322 182,334" fill="#94a3b8"/>
  <polygon points="400,330 392,322 408,322" fill="#94a3b8"/>
  <polygon points="630,330 622,322 618,334" fill="#94a3b8"/>
  
  <!-- Workers -->
  <g filter="url(#shadow)">
    <!-- Worker 1 -->
    <rect x="80" y="340" width="180" height="120" rx="10" fill="url(#workerGrad)"/>
    <text x="170" y="375" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Worker 1</text>
    <g transform="translate(105, 390)">
      <rect width="130" height="55" rx="6" fill="white" opacity="0.2"/>
      <text x="65" y="22" text-anchor="middle" fill="white" font-family="ui-monospace, monospace" font-size="12">4 concurrent slots</text>
      <g transform="translate(25, 32)">
        <rect width="18" height="18" rx="3" fill="white" opacity="0.9"/>
        <rect x="22" width="18" height="18" rx="3" fill="white" opacity="0.9"/>
        <rect x="44" width="18" height="18" rx="3" fill="white" opacity="0.9"/>
        <rect x="66" width="18" height="18" rx="3" fill="white" opacity="0.9"/>
      </g>
    </g>
    
    <!-- Worker 2 -->
    <rect x="310" y="340" width="180" height="120" rx="10" fill="url(#workerGrad)"/>
    <text x="400" y="375" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Worker 2</text>
    <g transform="translate(335, 390)">
      <rect width="130" height="55" rx="6" fill="white" opacity="0.2"/>
      <text x="65" y="22" text-anchor="middle" fill="white" font-family="ui-monospace, monospace" font-size="12">4 concurrent slots</text>
      <g transform="translate(25, 32)">
        <rect width="18" height="18" rx="3" fill="white" opacity="0.9"/>
        <rect x="22" width="18" height="18" rx="3" fill="white" opacity="0.9"/>
        <rect x="44" width="18" height="18" rx="3" fill="white" opacity="0.9"/>
        <rect x="66" width="18" height="18" rx="3" fill="white" opacity="0.9"/>
      </g>
    </g>
    
    <!-- Worker N -->
    <rect x="540" y="340" width="180" height="120" rx="10" fill="url(#workerGrad)"/>
    <text x="630" y="375" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Worker N</text>
    <g transform="translate(565, 390)">
      <rect width="130" height="55" rx="6" fill="white" opacity="0.2"/>
      <text x="65" y="22" text-anchor="middle" fill="white" font-family="ui-monospace, monospace" font-size="12">4 concurrent slots</text>
      <g transform="translate(25, 32)">
        <rect width="18" height="18" rx="3" fill="white" opacity="0.9"/>
        <rect x="22" width="18" height="18" rx="3" fill="white" opacity="0.9"/>
        <rect x="44" width="18" height="18" rx="3" fill="white" opacity="0.9"/>
        <rect x="66" width="18" height="18" rx="3" fill="white" opacity="0.9"/>
      </g>
    </g>
  </g>
  
  <!-- Ellipsis between workers -->
  <text x="280" y="410" fill="#64748b" font-size="24">···</text>
  <text x="505" y="410" fill="#64748b" font-size="24">···</text>
</svg>
