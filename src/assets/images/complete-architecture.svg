<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 650">
  <defs>
    <linearGradient id="pgGradFinal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#336791;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#264d73;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="workerGradFinal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="apiGradFinal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <filter id="shadowFinal" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <pattern id="gridFinal" width="15" height="15" patternUnits="userSpaceOnUse">
      <path d="M 15 0 L 0 0 0 15" fill="none" stroke="#f1f5f9" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="950" height="650" fill="#fafafa"/>
  <rect width="950" height="650" fill="url(#gridFinal)"/>
  
  <!-- Title -->
  <text x="475" y="35" text-anchor="middle" fill="#1e293b" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700">Complete Job Processing Architecture</text>
  <text x="475" y="58" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="14">PostgreSQL-based distributed background job system in Rust</text>
  
  <!-- External Systems / API Layer -->
  <g transform="translate(50, 85)">
    <rect width="200" height="100" rx="10" fill="url(#apiGradFinal)" filter="url(#shadowFinal)"/>
    <text x="100" y="30" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600">API / Application</text>
    <rect x="15" y="45" width="170" height="40" rx="5" fill="white" opacity="0.15"/>
    <text x="100" y="63" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="11">• Enqueue jobs</text>
    <text x="100" y="78" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="11">• Cancel jobs</text>
  </g>
  
  <!-- PostgreSQL -->
  <g transform="translate(320, 85)">
    <rect width="310" height="180" rx="12" fill="url(#pgGradFinal)" filter="url(#shadowFinal)"/>
    <text x="155" y="28" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="16" font-weight="600">PostgreSQL</text>
    
    <!-- Tables -->
    <g transform="translate(15, 45)">
      <rect width="130" height="55" rx="6" fill="white" opacity="0.95"/>
      <text x="65" y="20" text-anchor="middle" fill="#1e293b" font-family="ui-monospace, monospace" font-size="11" font-weight="600">jobs</text>
      <text x="65" y="35" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Primary queue</text>
      <text x="65" y="48" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">SKIP LOCKED</text>
    </g>
    
    <g transform="translate(165, 45)">
      <rect width="130" height="55" rx="6" fill="white" opacity="0.95"/>
      <text x="65" y="20" text-anchor="middle" fill="#1e293b" font-family="ui-monospace, monospace" font-size="11" font-weight="600">job_executions</text>
      <text x="65" y="35" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Audit trail</text>
      <text x="65" y="48" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">exec_id tracking</text>
    </g>
    
    <g transform="translate(15, 115)">
      <rect width="130" height="55" rx="6" fill="white" opacity="0.95"/>
      <text x="65" y="20" text-anchor="middle" fill="#1e293b" font-family="ui-monospace, monospace" font-size="11" font-weight="600">worker_heartbeats</text>
      <text x="65" y="35" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Lease management</text>
      <text x="65" y="48" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Liveness tracking</text>
    </g>
    
    <g transform="translate(165, 115)">
      <rect width="130" height="55" rx="6" fill="#fef2f2" opacity="0.95"/>
      <text x="65" y="20" text-anchor="middle" fill="#991b1b" font-family="ui-monospace, monospace" font-size="11" font-weight="600">dead_letter</text>
      <text x="65" y="35" text-anchor="middle" fill="#dc2626" font-family="system-ui, sans-serif" font-size="9">Failed jobs</text>
      <text x="65" y="48" text-anchor="middle" fill="#dc2626" font-family="system-ui, sans-serif" font-size="9">Manual review</text>
    </g>
  </g>
  
  <!-- Connection line from API to PostgreSQL -->
  <line x1="250" y1="135" x2="315" y2="135" stroke="#64748b" stroke-width="2"/>
  <polygon points="315,135 307,130 307,140" fill="#64748b"/>
  
  <!-- Workers Section -->
  <g transform="translate(50, 320)">
    <rect width="850" height="240" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadowFinal)"/>
    <text x="425" y="25" text-anchor="middle" fill="#1e293b" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Worker Pool</text>
    
    <!-- Worker 1 -->
    <g transform="translate(30, 45)">
      <rect width="240" height="170" rx="10" fill="url(#workerGradFinal)" filter="url(#shadowFinal)"/>
      <text x="120" y="25" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Worker 1</text>
      
      <!-- Components -->
      <g transform="translate(15, 40)">
        <rect width="100" height="35" rx="5" fill="white" opacity="0.2"/>
        <text x="50" y="15" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="10" font-weight="500">Dequeue Loop</text>
        <text x="50" y="28" text-anchor="middle" fill="white" font-family="ui-monospace, monospace" font-size="8">poll + acquire</text>
      </g>
      
      <g transform="translate(125, 40)">
        <rect width="100" height="35" rx="5" fill="white" opacity="0.2"/>
        <text x="50" y="15" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="10" font-weight="500">Heartbeat</text>
        <text x="50" y="28" text-anchor="middle" fill="white" font-family="ui-monospace, monospace" font-size="8">lease renewal</text>
      </g>
      
      <g transform="translate(15, 85)">
        <rect width="100" height="35" rx="5" fill="white" opacity="0.2"/>
        <text x="50" y="15" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="10" font-weight="500">Semaphore</text>
        <text x="50" y="28" text-anchor="middle" fill="white" font-family="ui-monospace, monospace" font-size="8">4 slots</text>
      </g>
      
      <g transform="translate(125, 85)">
        <rect width="100" height="35" rx="5" fill="white" opacity="0.2"/>
        <text x="50" y="15" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="10" font-weight="500">Reclaimer</text>
        <text x="50" y="28" text-anchor="middle" fill="white" font-family="ui-monospace, monospace" font-size="8">stale jobs</text>
      </g>
      
      <!-- Handler Registry -->
      <g transform="translate(15, 130)">
        <rect width="210" height="30" rx="5" fill="#8b5cf6"/>
        <text x="105" y="20" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="10" font-weight="500">Handler Registry: email | order | sync | report</text>
      </g>
    </g>
    
    <!-- Worker 2 (simplified) -->
    <g transform="translate(305, 45)">
      <rect width="240" height="170" rx="10" fill="url(#workerGradFinal)" filter="url(#shadowFinal)"/>
      <text x="120" y="25" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Worker 2</text>
      
      <g transform="translate(15, 45)">
        <rect width="210" height="65" rx="5" fill="white" opacity="0.15"/>
        <text x="105" y="25" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="11">Same architecture</text>
        <text x="105" y="45" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="10">Independent instance</text>
      </g>
      
      <!-- Processing indicator -->
      <g transform="translate(15, 120)">
        <rect width="210" height="40" rx="5" fill="#22c55e"/>
        <text x="105" y="17" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="10" font-weight="500">Currently processing:</text>
        <text x="105" y="32" text-anchor="middle" fill="white" font-family="ui-monospace, monospace" font-size="10">2/4 slots active</text>
      </g>
    </g>
    
    <!-- Worker N (simplified) -->
    <g transform="translate(580, 45)">
      <rect width="240" height="170" rx="10" fill="url(#workerGradFinal)" filter="url(#shadowFinal)"/>
      <text x="120" y="25" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Worker N</text>
      
      <g transform="translate(15, 45)">
        <rect width="210" height="65" rx="5" fill="white" opacity="0.15"/>
        <text x="105" y="25" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="11">Horizontally scalable</text>
        <text x="105" y="45" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="10">Add more workers anytime</text>
      </g>
      
      <!-- Multi-tenant indicator -->
      <g transform="translate(15, 120)">
        <rect width="210" height="40" rx="5" fill="#3b82f6"/>
        <text x="105" y="17" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="10" font-weight="500">Multi-tenant isolation:</text>
        <text x="105" y="32" text-anchor="middle" fill="white" font-family="ui-monospace, monospace" font-size="10">OrgContext per job</text>
      </g>
    </g>
  </g>
  
  <!-- Connection lines from PostgreSQL to Workers -->
  <g stroke="#64748b" stroke-width="2">
    <line x1="475" y1="270" x2="475" y2="315"/>
    <polygon points="475,315 470,307 480,307" fill="#64748b"/>
    
    <!-- Bidirectional arrows -->
    <text x="485" y="295" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">⇅ Poll + Update</text>
  </g>
  
  <!-- Key Techniques Legend -->
  <g transform="translate(680, 85)">
    <rect width="220" height="180" rx="10" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadowFinal)"/>
    <text x="110" y="25" text-anchor="middle" fill="#1e293b" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Key Techniques</text>
    
    <g font-family="system-ui, sans-serif" font-size="10" transform="translate(15, 40)">
      <rect width="8" height="8" rx="2" fill="#22c55e" y="2"/>
      <text x="15" y="10" fill="#475569">SKIP LOCKED dequeue</text>
      
      <rect width="8" height="8" rx="2" fill="#f59e0b" y="22"/>
      <text x="15" y="30" fill="#475569">Lease-based ownership</text>
      
      <rect width="8" height="8" rx="2" fill="#3b82f6" y="42"/>
      <text x="15" y="50" fill="#475569">Execution ID verification</text>
      
      <rect width="8" height="8" rx="2" fill="#8b5cf6" y="62"/>
      <text x="15" y="70" fill="#475569">Semaphore backpressure</text>
      
      <rect width="8" height="8" rx="2" fill="#ef4444" y="82"/>
      <text x="15" y="90" fill="#475569">Dead Letter Queue</text>
      
      <rect width="8" height="8" rx="2" fill="#06b6d4" y="102"/>
      <text x="15" y="110" fill="#475569">Graceful shutdown</text>
      
      <rect width="8" height="8" rx="2" fill="#ec4899" y="122"/>
      <text x="15" y="130" fill="#475569">Cooperative cancellation</text>
    </g>
  </g>
  
  <!-- Footer -->
  <text x="475" y="590" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Built with Rust + PostgreSQL + Tokio</text>
  <text x="475" y="610" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Production-ready distributed job processing</text>
</svg>
