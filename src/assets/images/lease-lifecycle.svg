<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="leaseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="expiredGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="500" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#1e293b" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">Lease Lifecycle with Heartbeats</text>
  
  <!-- Scenario 1: Normal Operation -->
  <g transform="translate(50, 60)">
    <text x="0" y="20" fill="#059669" font-family="system-ui, sans-serif" font-size="14" font-weight="600">✓ Normal Operation</text>
    
    <!-- Timeline arrow -->
    <line x1="0" y1="50" x2="380" y2="50" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="380,50 372,45 372,55" fill="#94a3b8"/>
    <text x="390" y="54" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Time</text>
    
    <!-- Lease bar -->
    <rect x="20" y="70" width="340" height="25" rx="4" fill="url(#leaseGrad)" filter="url(#shadow)"/>
    <text x="190" y="88" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="500">LEASE VALID</text>
    
    <!-- Time markers -->
    <g fill="#475569" font-family="ui-monospace, monospace" font-size="10">
      <line x1="20" y1="45" x2="20" y2="55" stroke="#475569" stroke-width="2"/>
      <text x="20" y="40" text-anchor="middle">t₀</text>
      <text x="20" y="115" text-anchor="middle" font-size="9">Dequeue</text>
      
      <line x1="130" y1="45" x2="130" y2="55" stroke="#f59e0b" stroke-width="2"/>
      <text x="130" y="40" text-anchor="middle">t₁</text>
      <text x="130" y="115" text-anchor="middle" font-size="9">Heartbeat</text>
      
      <line x1="240" y1="45" x2="240" y2="55" stroke="#f59e0b" stroke-width="2"/>
      <text x="240" y="40" text-anchor="middle">t₂</text>
      <text x="240" y="115" text-anchor="middle" font-size="9">Heartbeat</text>
      
      <line x1="340" y1="45" x2="340" y2="55" stroke="#22c55e" stroke-width="2"/>
      <text x="340" y="40" text-anchor="middle">t₃</text>
      <text x="340" y="115" text-anchor="middle" font-size="9">Complete</text>
    </g>
    
    <!-- Heartbeat pulses -->
    <circle cx="130" cy="82" r="8" fill="#fbbf24" stroke="white" stroke-width="2"/>
    <text x="130" y="86" text-anchor="middle" fill="white" font-size="10">♥</text>
    
    <circle cx="240" cy="82" r="8" fill="#fbbf24" stroke="white" stroke-width="2"/>
    <text x="240" y="86" text-anchor="middle" fill="white" font-size="10">♥</text>
    
    <!-- Intervals -->
    <g font-family="system-ui, sans-serif" font-size="9" fill="#64748b">
      <text x="75" y="135" text-anchor="middle">30s</text>
      <line x1="25" y1="132" x2="125" y2="132" stroke="#cbd5e1" stroke-width="1"/>
      
      <text x="185" y="135" text-anchor="middle">30s</text>
      <line x1="135" y1="132" x2="235" y2="132" stroke="#cbd5e1" stroke-width="1"/>
    </g>
  </g>
  
  <!-- Scenario 2: Worker Crash -->
  <g transform="translate(50, 230)">
    <text x="0" y="20" fill="#dc2626" font-family="system-ui, sans-serif" font-size="14" font-weight="600">✗ Worker Crash (No Heartbeats)</text>
    
    <!-- Timeline arrow -->
    <line x1="0" y1="50" x2="380" y2="50" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="380,50 372,45 372,55" fill="#94a3b8"/>
    <text x="390" y="54" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Time</text>
    
    <!-- Lease bar - valid portion -->
    <rect x="20" y="70" width="150" height="25" rx="4" fill="url(#leaseGrad)" filter="url(#shadow)"/>
    <text x="95" y="88" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="11" font-weight="500">VALID</text>
    
    <!-- Lease bar - expired portion -->
    <rect x="170" y="70" width="90" height="25" rx="4" fill="url(#expiredGrad)" filter="url(#shadow)"/>
    <text x="215" y="88" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="11" font-weight="500">EXPIRED</text>
    
    <!-- Reclaim indicator -->
    <rect x="260" y="65" width="100" height="35" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="310" y="80" text-anchor="middle" fill="#92400e" font-family="system-ui, sans-serif" font-size="10" font-weight="600">RECLAIMED</text>
    <text x="310" y="93" text-anchor="middle" fill="#a16207" font-family="system-ui, sans-serif" font-size="9">by Worker B</text>
    
    <!-- Time markers -->
    <g fill="#475569" font-family="ui-monospace, monospace" font-size="10">
      <line x1="20" y1="45" x2="20" y2="55" stroke="#475569" stroke-width="2"/>
      <text x="20" y="40" text-anchor="middle">t₀</text>
      <text x="20" y="115" text-anchor="middle" font-size="9">Dequeue</text>
      
      <line x1="100" y1="45" x2="100" y2="55" stroke="#ef4444" stroke-width="2"/>
      <text x="100" y="40" text-anchor="middle">t₁</text>
      <text x="100" y="115" text-anchor="middle" font-size="9" fill="#dc2626">CRASH</text>
      
      <line x1="170" y1="45" x2="170" y2="55" stroke="#ef4444" stroke-width="2"/>
      <text x="170" y="40" text-anchor="middle">t₂</text>
      <text x="170" y="115" text-anchor="middle" font-size="9">Lease</text>
      <text x="170" y="125" text-anchor="middle" font-size="9">Expires</text>
      
      <line x1="260" y1="45" x2="260" y2="55" stroke="#22c55e" stroke-width="2"/>
      <text x="260" y="40" text-anchor="middle">t₃</text>
      <text x="260" y="115" text-anchor="middle" font-size="9">Reclaim</text>
    </g>
    
    <!-- Crash marker -->
    <g transform="translate(100, 62)">
      <line x1="-8" y1="-8" x2="8" y2="8" stroke="#ef4444" stroke-width="3"/>
      <line x1="8" y1="-8" x2="-8" y2="8" stroke="#ef4444" stroke-width="3"/>
    </g>
  </g>
  
  <!-- Right side: Configuration box -->
  <g transform="translate(480, 60)">
    <rect width="380" height="180" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="190" y="30" text-anchor="middle" fill="#1e293b" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Timing Configuration</text>
    
    <g font-family="system-ui, sans-serif" font-size="13">
      <rect x="20" y="50" width="160" height="35" rx="4" fill="#f0fdf4"/>
      <text x="100" y="72" text-anchor="middle" fill="#166534" font-weight="500">lease_duration</text>
      <text x="220" y="72" fill="#475569">60 seconds</text>
      
      <rect x="20" y="95" width="160" height="35" rx="4" fill="#fef3c7"/>
      <text x="100" y="117" text-anchor="middle" fill="#92400e" font-weight="500">heartbeat_interval</text>
      <text x="220" y="117" fill="#475569">30 seconds</text>
      
      <rect x="20" y="140" width="160" height="35" rx="4" fill="#fef2f2"/>
      <text x="100" y="162" text-anchor="middle" fill="#991b1b" font-weight="500">reclaim_check</text>
      <text x="220" y="162" fill="#475569">60 seconds</text>
    </g>
  </g>
  
  <!-- Right side: Key insight box -->
  <g transform="translate(480, 260)">
    <rect width="380" height="110" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="190" y="30" text-anchor="middle" fill="#1e40af" font-family="system-ui, sans-serif" font-size="15" font-weight="600">💡 Key Insight</text>
    
    <text x="190" y="55" text-anchor="middle" fill="#1e3a8a" font-family="system-ui, sans-serif" font-size="12">Heartbeat interval &lt; Lease duration</text>
    <text x="190" y="75" text-anchor="middle" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="12">Multiple renewal opportunities</text>
    <text x="190" y="95" text-anchor="middle" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="12">survive brief network hiccups</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(50, 420)">
    <rect width="800" height="60" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <text x="400" y="20" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Legend</text>
    
    <g transform="translate(80, 35)">
      <rect width="50" height="16" rx="3" fill="url(#leaseGrad)"/>
      <text x="60" y="13" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Valid Lease</text>
    </g>
    
    <g transform="translate(220, 35)">
      <rect width="50" height="16" rx="3" fill="url(#expiredGrad)"/>
      <text x="60" y="13" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Expired Lease</text>
    </g>
    
    <g transform="translate(360, 35)">
      <circle cx="8" cy="8" r="8" fill="#fbbf24"/>
      <text x="8" y="12" text-anchor="middle" fill="white" font-size="10">♥</text>
      <text x="25" y="13" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Heartbeat</text>
    </g>
    
    <g transform="translate(500, 35)">
      <g transform="translate(8, 8)">
        <line x1="-6" y1="-6" x2="6" y2="6" stroke="#ef4444" stroke-width="2"/>
        <line x1="6" y1="-6" x2="-6" y2="6" stroke="#ef4444" stroke-width="2"/>
      </g>
      <text x="25" y="13" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Worker Crash</text>
    </g>
    
    <g transform="translate(640, 35)">
      <rect width="50" height="16" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="60" y="13" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Reclaimed</text>
    </g>
  </g>
</svg>
