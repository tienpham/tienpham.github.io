<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550">
  <defs>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="failGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dlqGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <filter id="shadowDlq" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowSuccess" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#22c55e"/>
    </marker>
    <marker id="arrowFail" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowDlq" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="550" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#1e293b" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">Dead Letter Queue Flow</text>
  <text x="400" y="55" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">Job retry lifecycle with max_attempts = 3</text>
  
  <!-- Job Created -->
  <g transform="translate(340, 80)">
    <rect width="120" height="50" rx="8" fill="#3b82f6" filter="url(#shadowDlq)"/>
    <text x="60" y="25" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Job Created</text>
    <text x="60" y="42" text-anchor="middle" fill="#bfdbfe" font-family="ui-monospace, monospace" font-size="10">attempts = 0</text>
  </g>
  
  <!-- Arrow down from created -->
  <line x1="400" y1="135" x2="400" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#arrowFail)"/>
  
  <!-- Attempt 1 -->
  <g transform="translate(150, 175)">
    <rect width="120" height="50" rx="8" fill="url(#failGrad)" filter="url(#shadowDlq)"/>
    <text x="60" y="25" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Attempt 1</text>
    <text x="60" y="42" text-anchor="middle" fill="#fef3c7" font-family="ui-monospace, monospace" font-size="10">Processing...</text>
    
    <!-- Success arrow -->
    <line x1="125" y1="25" x2="200" y2="25" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowSuccess)"/>
    <text x="162" y="18" fill="#22c55e" font-family="system-ui, sans-serif" font-size="10">Success</text>
  </g>
  
  <!-- Success box for Attempt 1 -->
  <g transform="translate(360, 175)">
    <rect width="90" height="50" rx="8" fill="url(#successGrad)" filter="url(#shadowDlq)"/>
    <text x="45" y="30" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="700">✓ Done</text>
  </g>
  
  <!-- Failure arrow down from Attempt 1 -->
  <g transform="translate(210, 230)">
    <line x1="0" y1="0" x2="0" y2="35" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowFail)"/>
    <text x="-30" y="20" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10">Failure</text>
  </g>
  
  <!-- Attempt 2 -->
  <g transform="translate(150, 275)">
    <rect width="120" height="50" rx="8" fill="url(#failGrad)" filter="url(#shadowDlq)"/>
    <text x="60" y="25" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Attempt 2</text>
    <text x="60" y="42" text-anchor="middle" fill="#fef3c7" font-family="ui-monospace, monospace" font-size="10">Retry after backoff</text>
    
    <!-- Success arrow -->
    <line x1="125" y1="25" x2="200" y2="25" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowSuccess)"/>
    <text x="162" y="18" fill="#22c55e" font-family="system-ui, sans-serif" font-size="10">Success</text>
  </g>
  
  <!-- Success box for Attempt 2 -->
  <g transform="translate(360, 275)">
    <rect width="90" height="50" rx="8" fill="url(#successGrad)" filter="url(#shadowDlq)"/>
    <text x="45" y="30" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="700">✓ Done</text>
  </g>
  
  <!-- Failure arrow down from Attempt 2 -->
  <g transform="translate(210, 330)">
    <line x1="0" y1="0" x2="0" y2="35" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowFail)"/>
    <text x="-30" y="20" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10">Failure</text>
  </g>
  
  <!-- Attempt 3 -->
  <g transform="translate(150, 375)">
    <rect width="120" height="50" rx="8" fill="url(#failGrad)" filter="url(#shadowDlq)"/>
    <text x="60" y="25" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Attempt 3</text>
    <text x="60" y="42" text-anchor="middle" fill="#fef3c7" font-family="ui-monospace, monospace" font-size="10">Final attempt</text>
    
    <!-- Success arrow -->
    <line x1="125" y1="25" x2="200" y2="25" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowSuccess)"/>
    <text x="162" y="18" fill="#22c55e" font-family="system-ui, sans-serif" font-size="10">Success</text>
  </g>
  
  <!-- Success box for Attempt 3 -->
  <g transform="translate(360, 375)">
    <rect width="90" height="50" rx="8" fill="url(#successGrad)" filter="url(#shadowDlq)"/>
    <text x="45" y="30" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="700">✓ Done</text>
  </g>
  
  <!-- Failure arrow to DLQ -->
  <g transform="translate(210, 430)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#ef4444" stroke-width="3" marker-end="url(#arrowDlq)"/>
    <text x="5" y="25" fill="#ef4444" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Max attempts!</text>
  </g>
  
  <!-- Dead Letter Queue -->
  <g transform="translate(100, 480)">
    <rect width="250" height="60" rx="10" fill="url(#dlqGrad)" filter="url(#shadowDlq)"/>
    <text x="125" y="25" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="15" font-weight="700">☠️ Dead Letter Queue</text>
    <text x="125" y="48" text-anchor="middle" fill="#fecaca" font-family="system-ui, sans-serif" font-size="11">Awaiting manual inspection</text>
  </g>
  
  <!-- DLQ Contents box -->
  <g transform="translate(480, 150)">
    <rect width="260" height="230" rx="10" fill="white" stroke="#ef4444" stroke-width="2" filter="url(#shadowDlq)"/>
    <rect x="0" y="0" width="260" height="35" rx="10" fill="#fef2f2"/>
    <text x="130" y="24" text-anchor="middle" fill="#991b1b" font-family="system-ui, sans-serif" font-size="13" font-weight="600">DLQ Record Contains</text>
    
    <g font-family="system-ui, sans-serif" font-size="11" fill="#475569" transform="translate(20, 55)">
      <text y="0" font-weight="500" fill="#1e293b">• Original payload</text>
      <text y="25" fill="#64748b" x="15">What the job was trying to do</text>
      
      <text y="55" font-weight="500" fill="#1e293b">• Execution history</text>
      <text y="80" fill="#64748b" x="15">All 3 attempt timestamps</text>
      
      <text y="110" font-weight="500" fill="#1e293b">• Error messages</text>
      <text y="135" fill="#64748b" x="15">Why each attempt failed</text>
      
      <text y="165" font-weight="500" fill="#1e293b">• Worker IDs</text>
      <text y="190" fill="#64748b" x="15">Which workers tried</text>
    </g>
  </g>
  
  <!-- Arrow from DLQ to manual action -->
  <g transform="translate(355, 510)">
    <line x1="0" y1="0" x2="70" y2="0" stroke="#64748b" stroke-width="2" marker-end="url(#arrowFail)"/>
  </g>
  
  <!-- Manual Action box -->
  <g transform="translate(430, 480)">
    <rect width="180" height="60" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="90" y="25" text-anchor="middle" fill="#1e40af" font-family="system-ui, sans-serif" font-size="12" font-weight="600">🔧 Manual Action</text>
    <text x="90" y="45" text-anchor="middle" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="11">Fix issue → Requeue</text>
  </g>
  
  <!-- Retry count visualization -->
  <g transform="translate(60, 175)">
    <text y="25" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">#1</text>
    <text y="125" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">#2</text>
    <text y="225" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">#3</text>
  </g>
</svg>
