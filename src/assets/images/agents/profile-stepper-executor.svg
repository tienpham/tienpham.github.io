<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <defs>
    <linearGradient id="profileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="executorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stepperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="toolsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="middlewareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#db2777;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="contextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="600" fill="#0f172a"/>
  
  <!-- Subtle grid -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5"/>
  </pattern>
  <rect width="900" height="600" fill="url(#grid)" opacity="0.6"/>
  
  <!-- Title -->
  <text x="450" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#f8fafc" text-anchor="middle">Profile + Stepper + Executor Architecture</text>
  
  <!-- AgentProfile Box -->
  <g filter="url(#shadow)">
    <rect x="100" y="80" width="700" height="90" rx="12" fill="url(#profileGrad)"/>
    <text x="450" y="115" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">AgentProfile</text>
    <text x="450" y="145" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle">WHAT: Configuration — model, tools, prompts, parameters</text>
  </g>
  
  <!-- Arrow from Profile to Executor -->
  <path d="M 450 170 L 450 205" stroke="#64748b" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- AgentExecutor Box -->
  <g filter="url(#shadow)">
    <rect x="100" y="210" width="700" height="200" rx="12" fill="#1e293b" stroke="url(#executorGrad)" stroke-width="3"/>
    <text x="450" y="245" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">AgentExecutor</text>
    <text x="450" y="270" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Unified execution loop + tool execution + middleware</text>
    
    <!-- Inner components -->
    <g>
      <!-- Stepper -->
      <rect x="130" y="295" width="170" height="90" rx="8" fill="url(#stepperGrad)"/>
      <text x="215" y="330" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Stepper</text>
      <text x="215" y="355" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">HOW: step logic</text>
      <text x="215" y="372" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">(ReAct / FunctionCalling)</text>
    </g>
    
    <g>
      <!-- ToolRegistry -->
      <rect x="365" y="295" width="170" height="90" rx="8" fill="url(#toolsGrad)"/>
      <text x="450" y="330" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">ToolRegistry</text>
      <text x="450" y="355" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Available tools</text>
      <text x="450" y="372" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">(search, memory, web...)</text>
    </g>
    
    <g>
      <!-- MiddlewarePipeline -->
      <rect x="600" y="295" width="170" height="90" rx="8" fill="url(#middlewareGrad)"/>
      <text x="685" y="325" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Middleware</text>
      <text x="685" y="345" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Pipeline</text>
      <text x="685" y="368" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Hooks: logging,</text>
      <text x="685" y="382" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">metrics, etc.</text>
    </g>
  </g>
  
  <!-- Arrows from Executor to Contexts -->
  <path d="M 215 410 L 215 455" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 685 410 L 685 455" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Context Boxes -->
  <g filter="url(#shadow)">
    <rect x="100" y="460" width="230" height="110" rx="10" fill="url(#contextGrad)"/>
    <text x="215" y="495" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">AgentContext</text>
    <text x="215" y="520" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">User-facing</text>
    <text x="215" y="540" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">messages</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="570" y="460" width="230" height="110" rx="10" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <text x="685" y="495" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">ExecutionContext</text>
    <text x="685" y="520" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Internal</text>
    <text x="685" y="540" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">reasoning</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(350, 480)">
    <rect x="0" y="0" width="200" height="80" rx="8" fill="#1e293b" opacity="0.9"/>
    <text x="100" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">SEPARATION OF CONCERNS</text>
    
    <circle cx="20" cy="40" r="6" fill="#f59e0b"/>
    <text x="35" y="44" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Configuration (WHAT)</text>
    
    <circle cx="20" cy="60" r="6" fill="#8b5cf6"/>
    <text x="35" y="64" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Logic (HOW)</text>
    
    <circle cx="110" cy="40" r="6" fill="#3b82f6"/>
    <text x="125" y="44" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Orchestration</text>
    
    <circle cx="110" cy="60" r="6" fill="#06b6d4"/>
    <text x="125" y="64" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">State</text>
  </g>
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
</svg>
