<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.2"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrowheadAmber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="700" fill="#0f172a"/>
  
  <!-- Grid -->
  <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
    <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1e293b" stroke-width="0.5"/>
  </pattern>
  <rect width="900" height="700" fill="url(#grid)" opacity="0.5"/>
  
  <!-- Title -->
  <text x="450" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#f8fafc" text-anchor="middle">Agent Execution Flow</text>
  
  <!-- Executor Loop Container -->
  <rect x="50" y="60" width="400" height="580" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="250" y="90" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">EXECUTOR LOOP</text>
  
  <!-- Step 1: Check iteration -->
  <g filter="url(#shadow)">
    <rect x="80" y="110" width="200" height="40" rx="6" fill="#334155"/>
    <text x="180" y="135" font-family="system-ui, sans-serif" font-size="12" fill="#f8fafc" text-anchor="middle">1. Check iteration limit</text>
  </g>
  
  <!-- Step 2: before_step middleware -->
  <g filter="url(#shadow)">
    <rect x="80" y="165" width="200" height="40" rx="6" fill="url(#violetGrad)"/>
    <text x="180" y="190" font-family="system-ui, sans-serif" font-size="12" fill="white" text-anchor="middle">2. before_step middleware</text>
  </g>
  
  <path d="M 180 150 L 180 165" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3: stepper.step() -->
  <g filter="url(#shadow)">
    <rect x="80" y="220" width="200" height="40" rx="6" fill="url(#amberGrad)"/>
    <text x="180" y="245" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">3. stepper.step()</text>
  </g>
  
  <path d="M 180 205 L 180 220" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 4: after_step middleware -->
  <g filter="url(#shadow)">
    <rect x="80" y="275" width="200" height="40" rx="6" fill="url(#violetGrad)"/>
    <text x="180" y="300" font-family="system-ui, sans-serif" font-size="12" fill="white" text-anchor="middle">4. after_step middleware</text>
  </g>
  
  <path d="M 180 260 L 180 275" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 5: Handle StepOutcome -->
  <g filter="url(#shadow)">
    <rect x="80" y="330" width="200" height="40" rx="6" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <text x="180" y="355" font-family="system-ui, sans-serif" font-size="12" fill="#f8fafc" text-anchor="middle">5. Handle StepOutcome</text>
  </g>
  
  <path d="M 180 315 L 180 330" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Outcome branches -->
  <g transform="translate(80, 385)">
    <rect x="0" y="0" width="90" height="30" rx="4" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
    <text x="45" y="20" font-family="system-ui, sans-serif" font-size="10" fill="#c4b5fd" text-anchor="middle">Continue</text>
    <text x="45" y="45" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">→ loop</text>
  </g>
  
  <g transform="translate(185, 385)">
    <rect x="0" y="0" width="90" height="30" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="45" y="20" font-family="system-ui, sans-serif" font-size="10" fill="#6ee7b7" text-anchor="middle">ExecuteTools</text>
    <text x="45" y="45" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">→ run tools, loop</text>
  </g>
  
  <g transform="translate(80, 455)">
    <rect x="0" y="0" width="90" height="30" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="45" y="20" font-family="system-ui, sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle">Complete</text>
    <text x="45" y="45" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">→ return result</text>
  </g>
  
  <g transform="translate(185, 455)">
    <rect x="0" y="0" width="90" height="30" rx="4" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
    <text x="45" y="20" font-family="system-ui, sans-serif" font-size="10" fill="#fda4af" text-anchor="middle">Failed</text>
    <text x="45" y="45" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">→ return error</text>
  </g>
  
  <!-- Loop back arrow -->
  <path d="M 310 400 Q 370 400 370 240 Q 370 130 280 130" stroke="#8b5cf6" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="283,125 293,130 283,135" fill="#8b5cf6"/>
  
  <!-- Stepper.step() detail box -->
  <rect x="480" y="60" width="380" height="350" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="670" y="90" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">STEPPER.step()</text>
  
  <!-- Stepper steps -->
  <g filter="url(#shadow)">
    <rect x="510" y="115" width="320" height="35" rx="6" fill="#334155"/>
    <text x="670" y="138" font-family="system-ui, sans-serif" font-size="11" fill="#f8fafc" text-anchor="middle">1. Build messages (system + context + steps)</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="510" y="165" width="320" height="35" rx="6" fill="#334155"/>
    <text x="670" y="188" font-family="system-ui, sans-serif" font-size="11" fill="#f8fafc" text-anchor="middle">2. Get generation params from profile</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="510" y="215" width="320" height="35" rx="6" fill="url(#blueGrad)"/>
    <text x="670" y="238" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white" text-anchor="middle">3. Call LLM via ExecutionContext</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="510" y="265" width="320" height="35" rx="6" fill="#334155"/>
    <text x="670" y="288" font-family="system-ui, sans-serif" font-size="11" fill="#f8fafc" text-anchor="middle">4. Parse response</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="510" y="315" width="320" height="35" rx="6" fill="#334155"/>
    <text x="670" y="338" font-family="system-ui, sans-serif" font-size="11" fill="#f8fafc" text-anchor="middle">5. Record steps in ExecutionContext</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="510" y="365" width="320" height="35" rx="6" fill="url(#emeraldGrad)"/>
    <text x="670" y="388" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white" text-anchor="middle">6. Return StepOutcome</text>
  </g>
  
  <!-- Arrows between stepper steps -->
  <path d="M 670 150 L 670 165" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M 670 200 L 670 215" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M 670 250 L 670 265" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M 670 300 L 670 315" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M 670 350 L 670 365" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Connection arrow from executor to stepper detail -->
  <path d="M 280 240 L 475 240" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrowheadAmber)"/>
  
  <!-- Legend -->
  <rect x="480" y="440" width="380" height="200" rx="12" fill="#1e293b" opacity="0.9"/>
  <text x="670" y="470" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">KEY RESPONSIBILITIES</text>
  
  <rect x="505" y="490" width="14" height="14" rx="3" fill="url(#blueGrad)"/>
  <text x="530" y="502" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Executor: Loop, tool dispatch, middleware</text>
  
  <rect x="505" y="520" width="14" height="14" rx="3" fill="url(#amberGrad)"/>
  <text x="530" y="532" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Stepper: Build messages, call LLM, parse</text>
  
  <rect x="505" y="550" width="14" height="14" rx="3" fill="url(#violetGrad)"/>
  <text x="530" y="562" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Middleware: Hooks at each stage</text>
  
  <rect x="505" y="580" width="14" height="14" rx="3" fill="url(#emeraldGrad)"/>
  <text x="530" y="592" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">StepOutcome: Control flow decisions</text>
  
  <rect x="505" y="610" width="14" height="14" rx="3" fill="#334155" stroke="#64748b"/>
  <text x="530" y="622" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Context: State management</text>
</svg>
