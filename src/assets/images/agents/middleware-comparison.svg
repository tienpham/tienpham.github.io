<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <defs>
    <linearGradient id="badGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f43f5e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e11d48;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="400" fill="#0f172a"/>
  
  <!-- Grid -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5"/>
  </pattern>
  <rect width="900" height="400" fill="url(#grid)" opacity="0.5"/>
  
  <!-- Title -->
  <text x="450" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle">With vs Without Middleware</text>
  
  <!-- Without Middleware -->
  <g filter="url(#shadow)">
    <rect x="50" y="60" width="380" height="300" rx="12" fill="#1e293b" stroke="url(#badGrad)" stroke-width="2"/>
    <rect x="50" y="60" width="380" height="45" rx="12" fill="url(#badGrad)"/>
    <rect x="50" y="93" width="380" height="12" fill="url(#badGrad)"/>
    <text x="240" y="90" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">Without Middleware</text>
    <text x="70" y="85" font-family="system-ui, sans-serif" font-size="14" fill="white">✗</text>
  </g>
  
  <!-- Code without middleware -->
  <g transform="translate(70, 125)">
    <text font-family="monospace" font-size="11" fill="#94a3b8">
      <tspan x="0" dy="0">Executor {</tspan>
      <tspan x="15" dy="18" fill="#f87171">log("starting step...");</tspan>
      <tspan x="160" dy="0" fill="#64748b">// Logging</tspan>
      <tspan x="15" dy="18" fill="#fbbf24">let start = Instant::now();</tspan>
      <tspan x="195" dy="0" fill="#64748b">// Metrics</tspan>
      <tspan x="15" dy="18" fill="#a78bfa">check_rate_limit();</tspan>
      <tspan x="160" dy="0" fill="#64748b">// Rate limiting</tspan>
      <tspan x="15" dy="18" fill="#f8fafc">let result = stepper.step();</tspan>
      <tspan x="210" dy="0" fill="#64748b">// Actual work</tspan>
      <tspan x="15" dy="18" fill="#fbbf24">record_latency(start.elapsed());</tspan>
      <tspan x="240" dy="0" fill="#64748b">// Metrics</tspan>
      <tspan x="15" dy="18" fill="#f87171">log("step complete");</tspan>
      <tspan x="165" dy="0" fill="#64748b">// Logging</tspan>
      <tspan x="0" dy="18">}</tspan>
    </text>
  </g>
  
  <!-- Problems list -->
  <g transform="translate(70, 295)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" fill="#f87171">✗ Core logic cluttered</text>
    <text x="0" y="18" font-family="system-ui, sans-serif" font-size="11" fill="#f87171">✗ Hard to add new concerns</text>
    <text x="0" y="36" font-family="system-ui, sans-serif" font-size="11" fill="#f87171">✗ Can't compose or reorder</text>
  </g>
  
  <!-- With Middleware -->
  <g filter="url(#shadow)">
    <rect x="470" y="60" width="380" height="300" rx="12" fill="#1e293b" stroke="url(#goodGrad)" stroke-width="2"/>
    <rect x="470" y="60" width="380" height="45" rx="12" fill="url(#goodGrad)"/>
    <rect x="470" y="93" width="380" height="12" fill="url(#goodGrad)"/>
    <text x="660" y="90" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">With Middleware</text>
    <text x="490" y="85" font-family="system-ui, sans-serif" font-size="14" fill="white">✓</text>
  </g>
  
  <!-- Code with middleware -->
  <g transform="translate(490, 125)">
    <text font-family="monospace" font-size="11" fill="#94a3b8">
      <tspan x="0" dy="0">Executor {</tspan>
      <tspan x="15" dy="18" fill="#6ee7b7">middleware.before_step();</tspan>
      <tspan x="210" dy="0" fill="#64748b">// Delegate</tspan>
      <tspan x="15" dy="18" fill="#f8fafc">let result = stepper.step();</tspan>
      <tspan x="210" dy="0" fill="#64748b">// Pure logic</tspan>
      <tspan x="15" dy="18" fill="#6ee7b7">middleware.after_step(result);</tspan>
      <tspan x="245" dy="0" fill="#64748b">// Delegate</tspan>
      <tspan x="0" dy="18">}</tspan>
      <tspan x="0" dy="30" fill="#64748b">// Separate, composable modules:</tspan>
      <tspan x="0" dy="18" fill="#f87171">LoggingMiddleware { ... }</tspan>
      <tspan x="0" dy="18" fill="#fbbf24">MetricsMiddleware { ... }</tspan>
      <tspan x="0" dy="18" fill="#a78bfa">RateLimitMiddleware { ... }</tspan>
    </text>
  </g>
  
  <!-- Benefits list -->
  <g transform="translate(490, 295)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" fill="#6ee7b7">✓ Clean core logic</text>
    <text x="0" y="18" font-family="system-ui, sans-serif" font-size="11" fill="#6ee7b7">✓ Easy to add concerns</text>
    <text x="0" y="36" font-family="system-ui, sans-serif" font-size="11" fill="#6ee7b7">✓ Composable and reorderable</text>
  </g>
</svg>
