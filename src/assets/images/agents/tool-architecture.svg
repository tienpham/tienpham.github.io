<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="500" fill="#0f172a"/>
  
  <!-- Grid -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5"/>
  </pattern>
  <rect width="900" height="500" fill="url(#grid)" opacity="0.5"/>
  
  <!-- Title -->
  <text x="450" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle">Tool Architecture</text>
  <text x="450" y="55" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">How agents interact with the outside world</text>
  
  <!-- Main container -->
  <rect x="50" y="75" width="800" height="380" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="450" y="100" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#f8fafc" text-anchor="middle">AGENT EXECUTION</text>
  
  <!-- Top flow: LLM -> Stepper -> StepOutcome -> Executor -->
  <g filter="url(#shadow)">
    <rect x="80" y="120" width="100" height="50" rx="8" fill="url(#blueGrad)"/>
    <text x="130" y="140" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">LLM</text>
    <text x="130" y="155" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)" text-anchor="middle">(thinks)</text>
  </g>
  
  <path d="M 180 145 L 210 145" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <g filter="url(#shadow)">
    <rect x="215" y="120" width="100" height="50" rx="8" fill="url(#violetGrad)"/>
    <text x="265" y="140" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">Stepper</text>
    <text x="265" y="155" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)" text-anchor="middle">(parses)</text>
  </g>
  
  <path d="M 315 145 L 345 145" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <g filter="url(#shadow)">
    <rect x="350" y="120" width="130" height="50" rx="8" fill="url(#amberGrad)"/>
    <text x="415" y="140" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">StepOutcome</text>
    <text x="415" y="155" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)" text-anchor="middle">ExecuteTools</text>
  </g>
  
  <path d="M 480 145 L 510 145" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <g filter="url(#shadow)">
    <rect x="515" y="120" width="100" height="50" rx="8" fill="url(#emeraldGrad)"/>
    <text x="565" y="140" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">Executor</text>
    <text x="565" y="155" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)" text-anchor="middle">(runs)</text>
  </g>
  
  <!-- Arrow down from Executor -->
  <path d="M 565 170 L 565 210" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- ToolRegistry -->
  <g filter="url(#shadow)">
    <rect x="470" y="215" width="190" height="60" rx="8" fill="#334155" stroke="#10b981" stroke-width="2"/>
    <text x="565" y="243" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#f8fafc" text-anchor="middle">ToolRegistry</text>
    <text x="565" y="263" font-family="system-ui, sans-serif" font-size="11" fill="#6ee7b7" text-anchor="middle">.get(name)</text>
  </g>
  
  <!-- Arrows to tools -->
  <path d="M 470 260 L 200 330" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 565 275 L 450 330" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 660 260 L 700 330" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Individual Tools -->
  <g filter="url(#shadow)">
    <rect x="100" y="335" width="150" height="70" rx="8" fill="url(#cyanGrad)"/>
    <text x="175" y="365" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">SearchTool</text>
    <text x="175" y="385" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)" text-anchor="middle">.execute()</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="375" y="335" width="150" height="70" rx="8" fill="url(#cyanGrad)"/>
    <text x="450" y="365" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">MemoryTool</text>
    <text x="450" y="385" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)" text-anchor="middle">.execute()</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="650" y="335" width="150" height="70" rx="8" fill="url(#cyanGrad)"/>
    <text x="725" y="365" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">WebTool</text>
    <text x="725" y="385" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)" text-anchor="middle">.execute()</text>
  </g>
  
  <!-- Flow description -->
  <rect x="80" y="420" width="740" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="450" y="440" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
    1. LLM decides tool → 2. Stepper parses → 3. Executor dispatches via registry → 4. Tool executes → 5. Result fed back to LLM
  </text>
</svg>
