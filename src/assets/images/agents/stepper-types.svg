<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550">
  <defs>
    <linearGradient id="reactGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="funcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="550" fill="#0f172a"/>
  
  <!-- Grid -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5"/>
  </pattern>
  <rect width="900" height="550" fill="url(#grid)" opacity="0.5"/>
  
  <!-- Title -->
  <text x="450" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#f8fafc" text-anchor="middle">Stepper Types Comparison</text>
  
  <!-- ReactStepper Column -->
  <g filter="url(#shadow)">
    <rect x="50" y="70" width="380" height="420" rx="12" fill="#1e293b" stroke="url(#reactGrad)" stroke-width="2"/>
    <rect x="50" y="70" width="380" height="50" rx="12" fill="url(#reactGrad)"/>
    <rect x="50" y="108" width="380" height="12" fill="url(#reactGrad)"/>
    <text x="240" y="102" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">ReactStepper</text>
  </g>
  
  <!-- React description -->
  <text x="240" y="150" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Text-based reasoning with markers</text>
  
  <!-- React flow -->
  <g transform="translate(70, 170)">
    <rect x="0" y="0" width="300" height="40" rx="6" fill="#334155"/>
    <text x="150" y="25" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">exec_ctx.chat(messages)</text>
  </g>
  
  <path d="M 220 215 L 220 235" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <g transform="translate(70, 240)">
    <rect x="0" y="0" width="300" height="80" rx="6" fill="#334155"/>
    <text x="150" y="20" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">LLM Response (text format):</text>
    <text x="15" y="40" font-family="monospace" font-size="10" fill="#8b5cf6">THOUGHT:</text>
    <text x="75" y="40" font-family="monospace" font-size="10" fill="#cbd5e1">I need to search...</text>
    <text x="15" y="55" font-family="monospace" font-size="10" fill="#f59e0b">ACTION:</text>
    <text x="65" y="55" font-family="monospace" font-size="10" fill="#cbd5e1">search_knowledge</text>
    <text x="15" y="70" font-family="monospace" font-size="10" fill="#10b981">ACTION_INPUT:</text>
    <text x="105" y="70" font-family="monospace" font-size="10" fill="#cbd5e1">{"query": "..."}</text>
  </g>
  
  <path d="M 220 325 L 220 345" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <g transform="translate(70, 350)">
    <rect x="0" y="0" width="300" height="40" rx="6" fill="#334155"/>
    <text x="150" y="25" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Parse text markers (ReactParser)</text>
  </g>
  
  <path d="M 220 395 L 220 415" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <g transform="translate(70, 420)">
    <rect x="0" y="0" width="300" height="40" rx="6" fill="url(#emeraldGrad)"/>
    <text x="150" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white" text-anchor="middle">Return StepOutcome::ExecuteTools</text>
  </g>
  
  <!-- FunctionCallingStepper Column -->
  <g filter="url(#shadow)">
    <rect x="470" y="70" width="380" height="420" rx="12" fill="#1e293b" stroke="url(#funcGrad)" stroke-width="2"/>
    <rect x="470" y="70" width="380" height="50" rx="12" fill="url(#funcGrad)"/>
    <rect x="470" y="108" width="380" height="12" fill="url(#funcGrad)"/>
    <text x="660" y="102" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">FunctionCallingStepper</text>
  </g>
  
  <!-- FunctionCalling description -->
  <text x="660" y="150" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Native LLM tool calling API</text>
  
  <!-- FunctionCalling flow -->
  <g transform="translate(490, 170)">
    <rect x="0" y="0" width="300" height="40" rx="6" fill="#334155"/>
    <text x="150" y="25" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">exec_ctx.chat_with_tools(messages, tools)</text>
  </g>
  
  <path d="M 640 215 L 640 235" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <g transform="translate(490, 240)">
    <rect x="0" y="0" width="300" height="80" rx="6" fill="#334155"/>
    <text x="150" y="20" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">LLM Response (structured):</text>
    <text x="15" y="40" font-family="monospace" font-size="10" fill="#3b82f6">response.tool_calls: [</text>
    <text x="25" y="55" font-family="monospace" font-size="10" fill="#cbd5e1">{name: "search_knowledge",</text>
    <text x="25" y="70" font-family="monospace" font-size="10" fill="#cbd5e1"> arguments: {query: "..."}}]</text>
  </g>
  
  <path d="M 640 325 L 640 345" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <g transform="translate(490, 350)">
    <rect x="0" y="0" width="300" height="40" rx="6" fill="#334155"/>
    <text x="150" y="25" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Extract from response.tool_calls</text>
  </g>
  
  <path d="M 640 395 L 640 415" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <g transform="translate(490, 420)">
    <rect x="0" y="0" width="300" height="40" rx="6" fill="url(#emeraldGrad)"/>
    <text x="150" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white" text-anchor="middle">Return StepOutcome::ExecuteTools</text>
  </g>
  
  <!-- Comparison note at bottom -->
  <rect x="200" y="500" width="500" height="35" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="450" y="522" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Both return same StepOutcome types → Interchangeable from executor's perspective</text>
</svg>
