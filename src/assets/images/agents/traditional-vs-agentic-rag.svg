<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="500" fill="#0f172a"/>
  
  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
  </pattern>
  <rect width="900" height="500" fill="url(#grid)" opacity="0.5"/>
  
  <!-- Title -->
  <text x="450" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#f8fafc" text-anchor="middle">Traditional RAG vs Agentic RAG</text>
  
  <!-- Traditional RAG Section -->
  <text x="225" y="90" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" text-anchor="middle">TRADITIONAL RAG</text>
  <text x="225" y="110" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Single-pass pipeline</text>
  
  <!-- Traditional RAG boxes -->
  <g filter="url(#shadow)">
    <rect x="40" y="140" width="100" height="50" rx="8" fill="url(#blueGrad)"/>
    <text x="90" y="170" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Query</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="175" y="140" width="100" height="50" rx="8" fill="url(#emeraldGrad)"/>
    <text x="225" y="170" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Retrieve</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="310" y="140" width="100" height="50" rx="8" fill="url(#amberGrad)"/>
    <text x="360" y="170" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Generate</text>
  </g>
  
  <!-- Arrows for Traditional -->
  <path d="M 140 165 L 170 165" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 275 165 L 305 165" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 410 165 L 440 165" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Answer for Traditional -->
  <rect x="360" y="205" width="80" height="35" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="400" y="228" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#f8fafc" text-anchor="middle">Answer</text>
  <path d="M 360 190 L 400 205" stroke="#64748b" stroke-width="2"/>
  
  <!-- Agentic RAG Section -->
  <text x="675" y="90" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" text-anchor="middle">AGENTIC RAG</text>
  <text x="675" y="110" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Multi-step reasoning loop</text>
  
  <!-- Agentic RAG boxes -->
  <g filter="url(#shadow)">
    <rect x="490" y="140" width="100" height="50" rx="8" fill="url(#blueGrad)"/>
    <text x="540" y="170" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Query</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="625" y="140" width="100" height="50" rx="8" fill="url(#violetGrad)"/>
    <text x="675" y="170" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Think</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="760" y="140" width="100" height="50" rx="8" fill="url(#emeraldGrad)"/>
    <text x="810" y="170" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Act</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="760" y="230" width="100" height="50" rx="8" fill="url(#amberGrad)"/>
    <text x="810" y="260" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Observe</text>
  </g>
  
  <!-- Arrows for Agentic -->
  <path d="M 590 165 L 620 165" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 725 165 L 755 165" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 810 190 L 810 225" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Loop arrow -->
  <path d="M 760 255 Q 675 290 675 190" stroke="#8b5cf6" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  <polygon points="675,195 670,205 680,205" fill="#8b5cf6"/>
  
  <!-- Loop label -->
  <rect x="630" y="300" width="90" height="24" rx="4" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
  <text x="675" y="317" font-family="system-ui, sans-serif" font-size="11" fill="#c4b5fd" text-anchor="middle">loop until done</text>
  
  <!-- Final Answer for Agentic -->
  <rect x="635" y="350" width="80" height="35" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="675" y="373" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#f8fafc" text-anchor="middle">Answer</text>
  <path d="M 675 324 L 675 350" stroke="#10b981" stroke-width="2" marker-end="url(#arrowheadGreen)"/>
  
  <!-- Comparison table -->
  <rect x="50" y="400" width="800" height="80" rx="8" fill="#1e293b" opacity="0.8"/>
  
  <!-- Table headers -->
  <text x="130" y="425" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">REASONING</text>
  <text x="290" y="425" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">TOOL USE</text>
  <text x="450" y="425" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">ITERATIONS</text>
  <text x="610" y="425" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">ADAPTABILITY</text>
  <text x="770" y="425" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">COMPLEXITY</text>
  
  <!-- Traditional values -->
  <text x="130" y="450" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">None</text>
  <text x="290" y="450" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Fixed</text>
  <text x="450" y="450" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Single</text>
  <text x="610" y="450" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Static</text>
  <text x="770" y="450" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Simple</text>
  
  <!-- Agentic values -->
  <text x="130" y="470" font-family="system-ui, sans-serif" font-size="12" fill="#10b981" text-anchor="middle">Multi-step</text>
  <text x="290" y="470" font-family="system-ui, sans-serif" font-size="12" fill="#10b981" text-anchor="middle">Dynamic</text>
  <text x="450" y="470" font-family="system-ui, sans-serif" font-size="12" fill="#10b981" text-anchor="middle">Multiple</text>
  <text x="610" y="470" font-family="system-ui, sans-serif" font-size="12" fill="#10b981" text-anchor="middle">Self-correcting</text>
  <text x="770" y="470" font-family="system-ui, sans-serif" font-size="12" fill="#10b981" text-anchor="middle">Complex</text>
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrowheadGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
  </defs>
</svg>
