<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#475569;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="500" fill="#0f172a"/>
  
  <!-- Grid -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5"/>
  </pattern>
  <rect width="900" height="500" fill="url(#grid)" opacity="0.5"/>
  
  <!-- Title -->
  <text x="450" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#f8fafc" text-anchor="middle">Dual Context Architecture</text>
  <text x="450" y="65" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Separating user-facing conversations from internal reasoning</text>
  
  <!-- AgentContext (User-Facing) -->
  <g filter="url(#shadow)">
    <rect x="50" y="100" width="380" height="340" rx="12" fill="#1e293b" stroke="url(#cyanGrad)" stroke-width="3"/>
    <rect x="50" y="100" width="380" height="50" rx="12" fill="url(#cyanGrad)"/>
    <rect x="50" y="138" width="380" height="12" fill="url(#cyanGrad)"/>
    <text x="240" y="132" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">AgentContext</text>
    <text x="240" y="175" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">USER-FACING VIEW</text>
  </g>
  
  <!-- Chat bubbles for AgentContext -->
  <g transform="translate(70, 200)">
    <!-- User message -->
    <rect x="0" y="0" width="280" height="50" rx="8" fill="#334155"/>
    <text x="15" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#06b6d4">User</text>
    <text x="15" y="38" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">"What's our Q4 revenue?"</text>
    
    <!-- Assistant response -->
    <rect x="60" y="65" width="280" height="50" rx="8" fill="#0891b2" opacity="0.2"/>
    <rect x="60" y="65" width="280" height="50" rx="8" fill="none" stroke="#0891b2" stroke-width="1"/>
    <text x="75" y="85" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#06b6d4">Assistant</text>
    <text x="75" y="103" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">"Based on the data, Q4 revenue was..."</text>
  </g>
  
  <!-- Annotation for AgentContext -->
  <g transform="translate(85, 350)">
    <rect x="0" y="0" width="180" height="70" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="90" y="25" font-family="system-ui, sans-serif" font-size="11" fill="#06b6d4" text-anchor="middle">✓ Clean conversations</text>
    <text x="90" y="45" font-family="system-ui, sans-serif" font-size="11" fill="#06b6d4" text-anchor="middle">✓ Only final answers</text>
    <text x="90" y="65" font-family="system-ui, sans-serif" font-size="11" fill="#06b6d4" text-anchor="middle">✓ User-friendly</text>
  </g>
  
  <!-- ExecutionContext (Internal) -->
  <g filter="url(#shadow)">
    <rect x="470" y="100" width="380" height="340" rx="12" fill="#1e293b" stroke="url(#slateGrad)" stroke-width="3"/>
    <rect x="470" y="100" width="380" height="50" rx="12" fill="url(#slateGrad)"/>
    <rect x="470" y="138" width="380" height="12" fill="url(#slateGrad)"/>
    <text x="660" y="132" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">ExecutionContext</text>
    <text x="660" y="175" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">INTERNAL REASONING TRACE</text>
  </g>
  
  <!-- Steps for ExecutionContext -->
  <g transform="translate(490, 195)">
    <!-- Thought -->
    <rect x="0" y="0" width="340" height="35" rx="6" fill="#334155"/>
    <text x="10" y="14" font-family="monospace" font-size="10" fill="#8b5cf6">[THOUGHT]</text>
    <text x="10" y="28" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">I need to search for revenue data...</text>
    
    <!-- Action -->
    <rect x="0" y="45" width="340" height="35" rx="6" fill="#334155"/>
    <text x="10" y="59" font-family="monospace" font-size="10" fill="#f59e0b">[ACTION]</text>
    <text x="10" y="73" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">search_knowledge({"query": "Q4 revenue"})</text>
    
    <!-- Observation -->
    <rect x="0" y="90" width="340" height="35" rx="6" fill="#334155"/>
    <text x="10" y="104" font-family="monospace" font-size="10" fill="#10b981">[OBSERVATION]</text>
    <text x="10" y="118" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Found 5 results: Q4 revenue was $2.3M...</text>
    
    <!-- Thought 2 -->
    <rect x="0" y="135" width="340" height="35" rx="6" fill="#334155"/>
    <text x="10" y="149" font-family="monospace" font-size="10" fill="#8b5cf6">[THOUGHT]</text>
    <text x="10" y="163" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Now I can answer the question...</text>
    
    <!-- Answer -->
    <rect x="0" y="180" width="340" height="35" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="10" y="194" font-family="monospace" font-size="10" fill="#3b82f6">[ANSWER]</text>
    <text x="10" y="208" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Based on the data, Q4 revenue was...</text>
  </g>
  
  <!-- Annotation for ExecutionContext -->
  <g transform="translate(635, 350)">
    <rect x="0" y="0" width="180" height="70" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="90" y="25" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">✓ Full reasoning trace</text>
    <text x="90" y="45" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">✓ Debug visibility</text>
    <text x="90" y="65" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">✓ Analytics-ready</text>
  </g>
  
  <!-- Connection indicator -->
  <text x="450" y="280" font-family="system-ui, sans-serif" font-size="24" fill="#64748b" text-anchor="middle">⟷</text>
  <text x="450" y="300" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Separate but</text>
  <text x="450" y="312" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">coordinated</text>
</svg>
