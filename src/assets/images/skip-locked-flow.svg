<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550">
  <defs>
    <linearGradient id="workerAGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="workerBGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#336791;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#264d73;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="550" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#1e293b" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">Concurrent Dequeue with SKIP LOCKED</text>
  
  <!-- Timeline -->
  <line x1="50" y1="500" x2="850" y2="500" stroke="#cbd5e1" stroke-width="2"/>
  <text x="450" y="530" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="14">Time →</text>
  
  <!-- Time markers -->
  <g fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">
    <line x1="150" y1="495" x2="150" y2="505" stroke="#94a3b8" stroke-width="2"/>
    <text x="150" y="520" text-anchor="middle">t₀</text>
    
    <line x1="350" y1="495" x2="350" y2="505" stroke="#94a3b8" stroke-width="2"/>
    <text x="350" y="520" text-anchor="middle">t₁</text>
    
    <line x1="550" y1="495" x2="550" y2="505" stroke="#94a3b8" stroke-width="2"/>
    <text x="550" y="520" text-anchor="middle">t₂</text>
    
    <line x1="750" y1="495" x2="750" y2="505" stroke="#94a3b8" stroke-width="2"/>
    <text x="750" y="520" text-anchor="middle">t₃</text>
  </g>
  
  <!-- Worker A column -->
  <g filter="url(#shadow)">
    <rect x="60" y="60" width="160" height="50" rx="8" fill="url(#workerAGrad)"/>
    <text x="140" y="92" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Worker A</text>
  </g>
  
  <!-- PostgreSQL column -->
  <g filter="url(#shadow)">
    <rect x="370" y="60" width="160" height="50" rx="8" fill="url(#dbGrad)"/>
    <text x="450" y="92" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="16" font-weight="600">PostgreSQL</text>
  </g>
  
  <!-- Worker B column -->
  <g filter="url(#shadow)">
    <rect x="680" y="60" width="160" height="50" rx="8" fill="url(#workerBGrad)"/>
    <text x="760" y="92" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Worker B</text>
  </g>
  
  <!-- Vertical lines for sequence -->
  <line x1="140" y1="120" x2="140" y2="480" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="450" y1="120" x2="450" y2="480" stroke="#6b7280" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="760" y1="120" x2="760" y2="480" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="4,4"/>
  
  <!-- Step 1: Worker A queries -->
  <g>
    <rect x="60" y="140" width="160" height="45" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="140" y="157" text-anchor="middle" fill="#1e40af" font-family="ui-monospace, monospace" font-size="10">SELECT ... FOR UPDATE</text>
    <text x="140" y="173" text-anchor="middle" fill="#1e40af" font-family="ui-monospace, monospace" font-size="10">SKIP LOCKED</text>
    
    <line x1="220" y1="162" x2="370" y2="162" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  </g>
  
  <!-- Step 2: PostgreSQL locks Job A -->
  <g>
    <rect x="370" y="185" width="160" height="60" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="450" y="205" text-anchor="middle" fill="#166534" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Lock acquired</text>
    <rect x="385" y="215" width="130" height="22" rx="4" fill="#22c55e"/>
    <text x="450" y="230" text-anchor="middle" fill="white" font-family="ui-monospace, monospace" font-size="11">Job A 🔒</text>
    
    <line x1="370" y1="215" x2="220" y2="215" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGray)"/>
  </g>
  
  <!-- Step 3: Worker B queries (slightly after) -->
  <g>
    <rect x="680" y="195" width="160" height="45" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="760" y="212" text-anchor="middle" fill="#5b21b6" font-family="ui-monospace, monospace" font-size="10">SELECT ... FOR UPDATE</text>
    <text x="760" y="228" text-anchor="middle" fill="#5b21b6" font-family="ui-monospace, monospace" font-size="10">SKIP LOCKED</text>
    
    <line x1="680" y1="217" x2="530" y2="217" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowPurple)"/>
  </g>
  
  <!-- Step 4: PostgreSQL skips Job A, returns Job B -->
  <g>
    <rect x="370" y="270" width="160" height="85" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
    <text x="450" y="290" text-anchor="middle" fill="#854d0e" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Job A is locked...</text>
    <text x="450" y="308" text-anchor="middle" fill="#a16207" font-family="system-ui, sans-serif" font-size="11">SKIP IT!</text>
    
    <rect x="385" y="318" width="130" height="22" rx="4" fill="#8b5cf6"/>
    <text x="450" y="333" text-anchor="middle" fill="white" font-family="ui-monospace, monospace" font-size="11">Job B 🔒</text>
    
    <line x1="530" y1="330" x2="680" y2="330" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowPurple)"/>
  </g>
  
  <!-- Result boxes -->
  <g filter="url(#shadow)">
    <rect x="60" y="380" width="160" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="140" y="405" text-anchor="middle" fill="#166534" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ Processing Job A</text>
    <text x="140" y="430" text-anchor="middle" fill="#166534" font-family="ui-monospace, monospace" font-size="11">No blocking!</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="680" y="380" width="160" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="760" y="405" text-anchor="middle" fill="#166534" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ Processing Job B</text>
    <text x="760" y="430" text-anchor="middle" fill="#166534" font-family="ui-monospace, monospace" font-size="11">No waiting!</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(310, 390)">
    <rect width="280" height="65" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <text x="140" y="20" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Key Insight</text>
    <text x="140" y="40" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Locked rows become invisible</text>
    <text x="140" y="55" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Workers never block each other</text>
  </g>
</svg>
