<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <defs>
    <linearGradient id="permitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="emptyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e2e8f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cbd5e1;stop-opacity:1" />
    </linearGradient>
    <filter id="shadowSem" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#22c55e"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="520" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#1e293b" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">Semaphore-Based Concurrency Control</text>
  <text x="450" y="58" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="14">Worker with max_concurrent_jobs = 3</text>
  
  <!-- ROW 1: Filling up permits -->
  
  <!-- Step 1: Initial State -->
  <g transform="translate(50, 90)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadowSem)"/>
    <rect x="0" y="0" width="200" height="30" rx="10" fill="#f8fafc"/>
    <text x="100" y="20" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="600">① Initial State</text>
    
    <!-- 3 available permits -->
    <g transform="translate(30, 45)">
      <rect width="40" height="30" rx="6" fill="url(#permitGrad)"/>
      <text x="20" y="20" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="700">■</text>
    </g>
    <g transform="translate(80, 45)">
      <rect width="40" height="30" rx="6" fill="url(#permitGrad)"/>
      <text x="20" y="20" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="700">■</text>
    </g>
    <g transform="translate(130, 45)">
      <rect width="40" height="30" rx="6" fill="url(#permitGrad)"/>
      <text x="20" y="20" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="700">■</text>
    </g>
    
    <text x="100" y="100" text-anchor="middle" fill="#22c55e" font-family="ui-monospace, monospace" font-size="13" font-weight="600">3 available</text>
  </g>
  
  <!-- Arrow 1→2 -->
  <g transform="translate(260, 145)">
    <line x1="0" y1="0" x2="55" y2="0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
    <text x="28" y="-8" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Jobs 1,2,3</text>
  </g>
  
  <!-- Step 2: At Capacity -->
  <g transform="translate(330, 90)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="white" stroke="#f59e0b" stroke-width="2" filter="url(#shadowSem)"/>
    <rect x="0" y="0" width="200" height="30" rx="10" fill="#fefce8"/>
    <text x="100" y="20" text-anchor="middle" fill="#a16207" font-family="system-ui, sans-serif" font-size="12" font-weight="600">② At Capacity</text>
    
    <!-- 0 available permits (all held) -->
    <g transform="translate(30, 45)">
      <rect width="40" height="30" rx="6" fill="url(#emptyGrad)" stroke="#94a3b8" stroke-width="1"/>
      <text x="20" y="20" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">□</text>
    </g>
    <g transform="translate(80, 45)">
      <rect width="40" height="30" rx="6" fill="url(#emptyGrad)" stroke="#94a3b8" stroke-width="1"/>
      <text x="20" y="20" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">□</text>
    </g>
    <g transform="translate(130, 45)">
      <rect width="40" height="30" rx="6" fill="url(#emptyGrad)" stroke="#94a3b8" stroke-width="1"/>
      <text x="20" y="20" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">□</text>
    </g>
    
    <text x="100" y="100" text-anchor="middle" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="13" font-weight="600">0 available</text>
  </g>
  
  <!-- Arrow 2→3 -->
  <g transform="translate(540, 145)">
    <line x1="0" y1="0" x2="55" y2="0" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
    <text x="28" y="-8" text-anchor="middle" fill="#dc2626" font-family="system-ui, sans-serif" font-size="10">Job 4 tries</text>
  </g>
  
  <!-- Step 3: Job 4 Blocked -->
  <g transform="translate(610, 90)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2" filter="url(#shadowSem)"/>
    <rect x="0" y="0" width="200" height="30" rx="10" fill="#fee2e2"/>
    <text x="100" y="20" text-anchor="middle" fill="#991b1b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">③ Job 4 Blocked</text>
    
    <text x="100" y="60" text-anchor="middle" fill="#dc2626" font-family="system-ui, sans-serif" font-size="16" font-weight="700">🚫 WAITING</text>
    <text x="100" y="82" text-anchor="middle" fill="#991b1b" font-family="ui-monospace, monospace" font-size="10">await semaphore</text>
    <text x="100" y="100" text-anchor="middle" fill="#991b1b" font-family="ui-monospace, monospace" font-size="10">.acquire()</text>
  </g>
  
  <!-- Curved arrow down from Blocked to Release row -->
  <g>
    <path d="M 710 215 L 710 250 L 530 250 L 530 275" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowGray)" stroke-dasharray="6,3"/>
    <text x="620" y="245" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">meanwhile...</text>
  </g>
  
  <!-- ROW 2: Release and proceed -->
  
  <!-- Step 4: Job 1 Completes -->
  <g transform="translate(330, 285)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" filter="url(#shadowSem)"/>
    <rect x="0" y="0" width="200" height="30" rx="10" fill="#dcfce7"/>
    <text x="100" y="20" text-anchor="middle" fill="#166534" font-family="system-ui, sans-serif" font-size="12" font-weight="600">④ Job 1 Completes</text>
    
    <!-- 1 available permit (released) -->
    <g transform="translate(30, 45)">
      <rect width="40" height="30" rx="6" fill="url(#permitGrad)"/>
      <text x="20" y="20" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="700">■</text>
    </g>
    <g transform="translate(80, 45)">
      <rect width="40" height="30" rx="6" fill="url(#emptyGrad)" stroke="#94a3b8" stroke-width="1"/>
      <text x="20" y="20" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">□</text>
    </g>
    <g transform="translate(130, 45)">
      <rect width="40" height="30" rx="6" fill="url(#emptyGrad)" stroke="#94a3b8" stroke-width="1"/>
      <text x="20" y="20" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">□</text>
    </g>
    
    <text x="100" y="100" text-anchor="middle" fill="#22c55e" font-family="ui-monospace, monospace" font-size="13" font-weight="600">1 released!</text>
  </g>
  
  <!-- Arrow 4→5 -->
  <g transform="translate(540, 340)">
    <line x1="0" y1="0" x2="55" y2="0" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="28" y="-8" text-anchor="middle" fill="#16a34a" font-family="system-ui, sans-serif" font-size="10">Job 4 wakes</text>
  </g>
  
  <!-- Step 5: Job 4 Proceeds -->
  <g transform="translate(610, 285)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="white" stroke="#22c55e" stroke-width="2" filter="url(#shadowSem)"/>
    <rect x="0" y="0" width="200" height="30" rx="10" fill="#dcfce7"/>
    <text x="100" y="20" text-anchor="middle" fill="#166534" font-family="system-ui, sans-serif" font-size="12" font-weight="600">⑤ Job 4 Proceeds</text>
    
    <!-- Back to 0 available -->
    <g transform="translate(30, 45)">
      <rect width="40" height="30" rx="6" fill="url(#emptyGrad)" stroke="#94a3b8" stroke-width="1"/>
      <text x="20" y="20" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">□</text>
    </g>
    <g transform="translate(80, 45)">
      <rect width="40" height="30" rx="6" fill="url(#emptyGrad)" stroke="#94a3b8" stroke-width="1"/>
      <text x="20" y="20" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">□</text>
    </g>
    <g transform="translate(130, 45)">
      <rect width="40" height="30" rx="6" fill="url(#emptyGrad)" stroke="#94a3b8" stroke-width="1"/>
      <text x="20" y="20" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">□</text>
    </g>
    
    <text x="100" y="85" text-anchor="middle" fill="#22c55e" font-family="system-ui, sans-serif" font-size="14" font-weight="700">✓ Acquired!</text>
    <text x="100" y="105" text-anchor="middle" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">0 available</text>
  </g>
  
  <!-- Legend box -->
  <g transform="translate(50, 430)">
    <rect width="800" height="75" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadowSem)"/>
    
    <text x="400" y="22" text-anchor="middle" fill="#1e293b" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Automatic Backpressure via Tokio Semaphore</text>
    
    <g transform="translate(100, 40)">
      <rect width="35" height="22" rx="5" fill="url(#permitGrad)"/>
      <text x="45" y="16" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Available Permit</text>
    </g>
    
    <g transform="translate(300, 40)">
      <rect width="35" height="22" rx="5" fill="url(#emptyGrad)" stroke="#94a3b8"/>
      <text x="45" y="16" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Held by Job</text>
    </g>
    
    <g transform="translate(500, 40)">
      <text x="0" y="16" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Permits auto-release when job task completes</text>
    </g>
  </g>
</svg>
