<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450">
  <defs>
    <linearGradient id="permitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="emptyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e2e8f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cbd5e1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blockedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <filter id="shadowSem" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="450" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#1e293b" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">Semaphore-Based Concurrency Control</text>
  <text x="450" y="58" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="14">Worker with max_concurrent_jobs = 3</text>
  
  <!-- State 1: Initial -->
  <g transform="translate(50, 90)">
    <text x="0" y="0" fill="#475569" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Initial State</text>
    
    <rect x="0" y="15" width="190" height="70" rx="8" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadowSem)"/>
    <text x="95" y="40" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Semaphore Permits</text>
    
    <!-- 3 available permits -->
    <g transform="translate(25, 50)">
      <rect width="40" height="28" rx="5" fill="url(#permitGrad)"/>
      <text x="20" y="19" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="11" font-weight="600">■</text>
    </g>
    <g transform="translate(75, 50)">
      <rect width="40" height="28" rx="5" fill="url(#permitGrad)"/>
      <text x="20" y="19" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="11" font-weight="600">■</text>
    </g>
    <g transform="translate(125, 50)">
      <rect width="40" height="28" rx="5" fill="url(#permitGrad)"/>
      <text x="20" y="19" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="11" font-weight="600">■</text>
    </g>
    
    <text x="95" y="105" text-anchor="middle" fill="#22c55e" font-family="ui-monospace, monospace" font-size="12" font-weight="500">3 available</text>
  </g>
  
  <!-- Arrow -->
  <g transform="translate(260, 145)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="40,0 32,-5 32,5" fill="#94a3b8"/>
    <text x="20" y="20" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Job 1</text>
  </g>
  
  <!-- State 2: 1 Job -->
  <g transform="translate(320, 90)">
    <text x="0" y="0" fill="#475569" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Job 1 Arrives</text>
    
    <rect x="0" y="15" width="190" height="70" rx="8" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadowSem)"/>
    
    <g transform="translate(25, 50)">
      <rect width="40" height="28" rx="5" fill="url(#emptyGrad)" stroke="#94a3b8" stroke-width="1"/>
      <text x="20" y="19" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">□</text>
    </g>
    <g transform="translate(75, 50)">
      <rect width="40" height="28" rx="5" fill="url(#permitGrad)"/>
      <text x="20" y="19" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="11" font-weight="600">■</text>
    </g>
    <g transform="translate(125, 50)">
      <rect width="40" height="28" rx="5" fill="url(#permitGrad)"/>
      <text x="20" y="19" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="11" font-weight="600">■</text>
    </g>
    
    <text x="95" y="105" text-anchor="middle" fill="#64748b" font-family="ui-monospace, monospace" font-size="12">2 available</text>
  </g>
  
  <!-- Arrow -->
  <g transform="translate(530, 145)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="40,0 32,-5 32,5" fill="#94a3b8"/>
    <text x="20" y="20" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Jobs 2,3</text>
  </g>
  
  <!-- State 3: Full -->
  <g transform="translate(590, 90)">
    <text x="0" y="0" fill="#475569" font-family="system-ui, sans-serif" font-size="13" font-weight="600">At Capacity</text>
    
    <rect x="0" y="15" width="190" height="70" rx="8" fill="white" stroke="#f59e0b" stroke-width="2" filter="url(#shadowSem)"/>
    
    <g transform="translate(25, 50)">
      <rect width="40" height="28" rx="5" fill="url(#emptyGrad)" stroke="#94a3b8" stroke-width="1"/>
      <text x="20" y="19" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">□</text>
    </g>
    <g transform="translate(75, 50)">
      <rect width="40" height="28" rx="5" fill="url(#emptyGrad)" stroke="#94a3b8" stroke-width="1"/>
      <text x="20" y="19" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">□</text>
    </g>
    <g transform="translate(125, 50)">
      <rect width="40" height="28" rx="5" fill="url(#emptyGrad)" stroke="#94a3b8" stroke-width="1"/>
      <text x="20" y="19" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">□</text>
    </g>
    
    <text x="95" y="105" text-anchor="middle" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="12" font-weight="500">0 available</text>
  </g>
  
  <!-- State 4: Blocked -->
  <g transform="translate(590, 230)">
    <text x="0" y="0" fill="#dc2626" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Job 4 Tries...</text>
    
    <rect x="0" y="15" width="190" height="90" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2" filter="url(#shadowSem)"/>
    
    <text x="95" y="50" text-anchor="middle" fill="#991b1b" font-family="system-ui, sans-serif" font-size="14" font-weight="700">🚫 BLOCKED</text>
    <text x="95" y="72" text-anchor="middle" fill="#dc2626" font-family="system-ui, sans-serif" font-size="11">Waiting for permit...</text>
    <text x="95" y="92" text-anchor="middle" fill="#dc2626" font-family="ui-monospace, monospace" font-size="10">await semaphore.acquire()</text>
  </g>
  
  <!-- State 5: Release -->
  <g transform="translate(320, 230)">
    <text x="0" y="0" fill="#22c55e" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Job 1 Completes</text>
    
    <rect x="0" y="15" width="190" height="70" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" filter="url(#shadowSem)"/>
    
    <g transform="translate(25, 50)">
      <rect width="40" height="28" rx="5" fill="url(#permitGrad)"/>
      <text x="20" y="19" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="11" font-weight="600">■</text>
    </g>
    <g transform="translate(75, 50)">
      <rect width="40" height="28" rx="5" fill="url(#emptyGrad)" stroke="#94a3b8" stroke-width="1"/>
      <text x="20" y="19" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">□</text>
    </g>
    <g transform="translate(125, 50)">
      <rect width="40" height="28" rx="5" fill="url(#emptyGrad)" stroke="#94a3b8" stroke-width="1"/>
      <text x="20" y="19" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">□</text>
    </g>
    
    <text x="95" y="105" text-anchor="middle" fill="#22c55e" font-family="ui-monospace, monospace" font-size="12" font-weight="500">1 available!</text>
  </g>
  
  <!-- Arrow from release to blocked -->
  <g transform="translate(510, 275)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#22c55e" stroke-width="2"/>
    <polygon points="60,0 52,-5 52,5" fill="#22c55e"/>
  </g>
  
  <!-- State 6: Job 4 proceeds -->
  <g transform="translate(50, 230)">
    <text x="0" y="0" fill="#22c55e" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Job 4 Proceeds</text>
    
    <rect x="0" y="15" width="190" height="70" rx="8" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadowSem)"/>
    
    <g transform="translate(25, 50)">
      <rect width="40" height="28" rx="5" fill="url(#emptyGrad)" stroke="#94a3b8" stroke-width="1"/>
      <text x="20" y="19" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">□</text>
    </g>
    <g transform="translate(75, 50)">
      <rect width="40" height="28" rx="5" fill="url(#emptyGrad)" stroke="#94a3b8" stroke-width="1"/>
      <text x="20" y="19" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">□</text>
    </g>
    <g transform="translate(125, 50)">
      <rect width="40" height="28" rx="5" fill="url(#emptyGrad)" stroke="#94a3b8" stroke-width="1"/>
      <text x="20" y="19" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">□</text>
    </g>
    
    <text x="95" y="105" text-anchor="middle" fill="#64748b" font-family="ui-monospace, monospace" font-size="12">0 available</text>
  </g>
  
  <!-- Arrow -->
  <g transform="translate(260, 275)">
    <line x1="40" y1="0" x2="0" y2="0" stroke="#22c55e" stroke-width="2"/>
    <polygon points="0,0 8,-5 8,5" fill="#22c55e"/>
    <text x="20" y="20" text-anchor="middle" fill="#22c55e" font-family="system-ui, sans-serif" font-size="10">Acquires</text>
  </g>
  
  <!-- Legend box -->
  <g transform="translate(50, 370)">
    <rect width="800" height="60" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadowSem)"/>
    
    <text x="400" y="22" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Key: Automatic Backpressure</text>
    
    <g transform="translate(120, 35)">
      <rect width="30" height="18" rx="4" fill="url(#permitGrad)"/>
      <text x="40" y="14" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Available Permit</text>
    </g>
    
    <g transform="translate(300, 35)">
      <rect width="30" height="18" rx="4" fill="url(#emptyGrad)" stroke="#94a3b8"/>
      <text x="40" y="14" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Held by Job</text>
    </g>
    
    <g transform="translate(480, 35)">
      <text x="0" y="14" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Permits auto-release when job task drops</text>
    </g>
  </g>
</svg>
