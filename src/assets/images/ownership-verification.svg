<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550">
  <defs>
    <linearGradient id="workerAGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="workerBGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowGray2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="550" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#1e293b" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">Execution ID Prevents Split-Brain</text>
  
  <!-- Worker columns -->
  <g filter="url(#shadow2)">
    <rect x="60" y="60" width="140" height="45" rx="8" fill="url(#workerAGrad2)"/>
    <text x="130" y="88" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Worker A</text>
  </g>
  
  <g filter="url(#shadow2)">
    <rect x="700" y="60" width="140" height="45" rx="8" fill="url(#workerBGrad2)"/>
    <text x="770" y="88" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Worker B</text>
  </g>
  
  <!-- Vertical timeline lines -->
  <line x1="130" y1="115" x2="130" y2="510" stroke="#93c5fd" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="770" y1="115" x2="770" y2="510" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Center database representation -->
  <rect x="380" y="70" width="140" height="35" rx="6" fill="#336791" filter="url(#shadow2)"/>
  <text x="450" y="93" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="13" font-weight="500">PostgreSQL</text>
  
  <!-- Timeline events -->
  
  <!-- t0: Worker A dequeues -->
  <g transform="translate(0, 130)">
    <rect x="50" y="0" width="160" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="130" y="20" text-anchor="middle" fill="#1e40af" font-family="system-ui, sans-serif" font-size="11" font-weight="600">t₀: Dequeue Job X</text>
    <text x="130" y="38" text-anchor="middle" fill="#3b82f6" font-family="ui-monospace, monospace" font-size="11">exec_id = ABC</text>
    
    <line x1="210" y1="25" x2="380" y2="25" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowGray2)"/>
    
    <rect x="380" y="5" width="140" height="40" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
    <text x="450" y="22" text-anchor="middle" fill="#166534" font-family="ui-monospace, monospace" font-size="10">current_exec_id</text>
    <text x="450" y="38" text-anchor="middle" fill="#166534" font-family="ui-monospace, monospace" font-size="12" font-weight="700">= ABC</text>
  </g>
  
  <!-- t1: Worker A crashes -->
  <g transform="translate(0, 200)">
    <rect x="50" y="0" width="160" height="40" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="130" y="16" text-anchor="middle" fill="#991b1b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">t₁: NETWORK PARTITION</text>
    <text x="130" y="32" text-anchor="middle" fill="#dc2626" font-family="system-ui, sans-serif" font-size="10">(Worker A isolated)</text>
    
    <!-- X mark -->
    <g transform="translate(210, 20)">
      <circle r="15" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
      <line x1="-6" y1="-6" x2="6" y2="6" stroke="#ef4444" stroke-width="3"/>
      <line x1="6" y1="-6" x2="-6" y2="6" stroke="#ef4444" stroke-width="3"/>
    </g>
    
    <line x1="230" y1="20" x2="380" y2="20" stroke="#ef4444" stroke-width="2" stroke-dasharray="8,4"/>
  </g>
  
  <!-- t2: Lease expires, Worker B reclaims -->
  <g transform="translate(0, 270)">
    <rect x="380" y="0" width="140" height="35" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="450" y="22" text-anchor="middle" fill="#92400e" font-family="system-ui, sans-serif" font-size="11" font-weight="600">t₂: Lease Expires</text>
    
    <rect x="620" y="0" width="160" height="50" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="700" y="20" text-anchor="middle" fill="#5b21b6" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Reclaims Job X</text>
    <text x="700" y="38" text-anchor="middle" fill="#7c3aed" font-family="ui-monospace, monospace" font-size="11">exec_id = DEF</text>
    
    <line x1="620" y1="25" x2="520" y2="25" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowGray2)"/>
    
    <!-- Update database -->
    <rect x="380" y="45" width="140" height="40" rx="4" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1"/>
    <text x="450" y="62" text-anchor="middle" fill="#5b21b6" font-family="ui-monospace, monospace" font-size="10">current_exec_id</text>
    <text x="450" y="78" text-anchor="middle" fill="#5b21b6" font-family="ui-monospace, monospace" font-size="12" font-weight="700">= DEF</text>
  </g>
  
  <!-- t3: Worker A recovers, tries to heartbeat -->
  <g transform="translate(0, 380)">
    <rect x="50" y="0" width="160" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="130" y="18" text-anchor="middle" fill="#1e40af" font-family="system-ui, sans-serif" font-size="11" font-weight="600">t₃: Network Recovers</text>
    <text x="130" y="36" text-anchor="middle" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="10">Tries heartbeat with</text>
    <text x="130" y="48" text-anchor="middle" fill="#3b82f6" font-family="ui-monospace, monospace" font-size="10">exec_id = ABC</text>
    
    <line x1="210" y1="25" x2="380" y2="25" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowGray2)"/>
    
    <!-- Rejection box -->
    <rect x="380" y="-5" width="140" height="60" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="450" y="15" text-anchor="middle" fill="#991b1b" font-family="system-ui, sans-serif" font-size="12" font-weight="700">❌ REJECTED</text>
    <text x="450" y="32" text-anchor="middle" fill="#dc2626" font-family="ui-monospace, monospace" font-size="10">ABC ≠ DEF</text>
    <text x="450" y="47" text-anchor="middle" fill="#dc2626" font-family="system-ui, sans-serif" font-size="9">0 rows updated</text>
    
    <!-- Response back to Worker A -->
    <line x1="380" y1="40" x2="210" y2="40" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowGray2)"/>
  </g>
  
  <!-- Outcome boxes -->
  <g transform="translate(50, 460)">
    <rect width="160" height="45" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="80" y="20" text-anchor="middle" fill="#991b1b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Worker A</text>
    <text x="80" y="36" text-anchor="middle" fill="#dc2626" font-family="system-ui, sans-serif" font-size="10">Knows it lost ownership</text>
  </g>
  
  <g transform="translate(620, 460)">
    <rect width="160" height="45" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="80" y="20" text-anchor="middle" fill="#166534" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Worker B</text>
    <text x="80" y="36" text-anchor="middle" fill="#16a34a" font-family="system-ui, sans-serif" font-size="10">Continues processing ✓</text>
  </g>
  
  <!-- Key insight box -->
  <g transform="translate(310, 450)">
    <rect width="280" height="55" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow2)"/>
    <text x="140" y="22" text-anchor="middle" fill="#1e40af" font-family="system-ui, sans-serif" font-size="12" font-weight="600">💡 No Split Brain!</text>
    <text x="140" y="42" text-anchor="middle" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="11">Execution ID ensures single ownership</text>
  </g>
  
  <!-- Time labels on left side -->
  <g transform="translate(20, 0)" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">
    <text x="0" y="155" text-anchor="end">t₀</text>
    <text x="0" y="220" text-anchor="end">t₁</text>
    <text x="0" y="288" text-anchor="end">t₂</text>
    <text x="0" y="405" text-anchor="end">t₃</text>
  </g>
</svg>
