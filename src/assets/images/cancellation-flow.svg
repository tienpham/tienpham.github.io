<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <defs>
    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dbGradC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#336791;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#264d73;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="workerGradC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="handlerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <filter id="shadowC" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#22c55e"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="520" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#1e293b" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">Cooperative Job Cancellation Flow</text>
  
  <!-- Component Headers -->
  <g filter="url(#shadowC)">
    <!-- Admin/API -->
    <rect x="80" y="60" width="130" height="50" rx="8" fill="url(#apiGrad)"/>
    <text x="145" y="90" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Admin API</text>
    
    <!-- PostgreSQL -->
    <rect x="280" y="60" width="130" height="50" rx="8" fill="url(#dbGradC)"/>
    <text x="345" y="90" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600">PostgreSQL</text>
    
    <!-- Worker -->
    <rect x="480" y="60" width="130" height="50" rx="8" fill="url(#workerGradC)"/>
    <text x="545" y="90" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Worker</text>
    
    <!-- Job Handler -->
    <rect x="680" y="60" width="130" height="50" rx="8" fill="url(#handlerGrad)"/>
    <text x="745" y="90" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Job Handler</text>
  </g>
  
  <!-- Vertical Lifelines -->
  <line x1="145" y1="115" x2="145" y2="420" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="345" y1="115" x2="345" y2="420" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="545" y1="115" x2="545" y2="420" stroke="#fdba74" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="745" y1="115" x2="745" y2="420" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="6,4"/>
  
  <!-- Step 1: Cancel Request (Admin → PostgreSQL) -->
  <g>
    <line x1="150" y1="150" x2="335" y2="150" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <rect x="170" y="130" width="150" height="35" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="245" y="145" text-anchor="middle" fill="#1e40af" font-family="system-ui, sans-serif" font-size="10" font-weight="600">1. Cancel Request</text>
    <text x="245" y="158" text-anchor="middle" fill="#3b82f6" font-family="ui-monospace, monospace" font-size="9">status = 'cancelled'</text>
  </g>
  
  <!-- Step 2: Status stored -->
  <g>
    <rect x="305" y="175" width="80" height="25" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
    <text x="345" y="192" text-anchor="middle" fill="#166534" font-family="system-ui, sans-serif" font-size="10">✓ Stored</text>
  </g>
  
  <!-- Step 3: Heartbeat (Worker → PostgreSQL) -->
  <g>
    <line x1="540" y1="230" x2="355" y2="230" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowOrange)"/>
    <rect x="380" y="210" width="130" height="35" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="445" y="225" text-anchor="middle" fill="#92400e" font-family="system-ui, sans-serif" font-size="10" font-weight="600">2. Heartbeat</text>
    <text x="445" y="238" text-anchor="middle" fill="#a16207" font-family="ui-monospace, monospace" font-size="9">update_heartbeat()</text>
  </g>
  
  <!-- Step 4: Return cancelled status (PostgreSQL → Worker) -->
  <g>
    <line x1="355" y1="280" x2="535" y2="280" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
    <rect x="380" y="260" width="130" height="35" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="445" y="275" text-anchor="middle" fill="#991b1b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">3. Returns</text>
    <text x="445" y="288" text-anchor="middle" fill="#dc2626" font-family="ui-monospace, monospace" font-size="9">Status::Cancelled</text>
  </g>
  
  <!-- Step 5: Signal cancellation (Worker → Handler) -->
  <g>
    <line x1="555" y1="330" x2="735" y2="330" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
    <rect x="580" y="310" width="130" height="35" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="645" y="325" text-anchor="middle" fill="#991b1b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">4. Signal Token</text>
    <text x="645" y="338" text-anchor="middle" fill="#dc2626" font-family="ui-monospace, monospace" font-size="9">cancel_token.cancel()</text>
  </g>
  
  <!-- Step 6: Handler exits cleanly -->
  <g>
    <rect x="680" y="365" width="130" height="50" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="745" y="385" text-anchor="middle" fill="#166534" font-family="system-ui, sans-serif" font-size="10" font-weight="600">5. Handler Exits</text>
    <text x="745" y="400" text-anchor="middle" fill="#16a34a" font-family="ui-monospace, monospace" font-size="9">is_cancelled() → true</text>
    <text x="745" y="412" text-anchor="middle" fill="#16a34a" font-family="ui-monospace, monospace" font-size="9">return Ok(())</text>
  </g>
  
  <!-- Time labels -->
  <g fill="#64748b" font-family="ui-monospace, monospace" font-size="11">
    <text x="40" y="155">t₁</text>
    <text x="40" y="235">t₂</text>
    <text x="40" y="285">t₃</text>
    <text x="40" y="335">t₄</text>
    <text x="40" y="390">t₅</text>
  </g>
  
  <!-- Key insight box -->
  <g filter="url(#shadowC)">
    <rect x="80" y="440" width="350" height="65" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="255" y="465" text-anchor="middle" fill="#1e40af" font-family="system-ui, sans-serif" font-size="13" font-weight="600">💡 Cooperative Cancellation</text>
    <text x="255" y="485" text-anchor="middle" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="11">Handler must periodically check ctx.is_cancelled()</text>
    <text x="255" y="500" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Cancellation is detected via heartbeat response</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(500, 440)">
    <rect width="310" height="65" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadowC)"/>
    <text x="155" y="20" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Flow Summary</text>
    
    <g font-family="system-ui, sans-serif" font-size="10" fill="#64748b">
      <circle cx="25" cy="38" r="4" fill="#3b82f6"/>
      <text x="35" y="42">External cancel request</text>
      
      <circle cx="165" cy="38" r="4" fill="#ef4444"/>
      <text x="175" y="42">Cancellation signal</text>
      
      <circle cx="25" cy="55" r="4" fill="#22c55e"/>
      <text x="35" y="59">Clean exit</text>
      
      <circle cx="165" cy="55" r="4" fill="#f59e0b"/>
      <text x="175" y="59">Heartbeat check</text>
    </g>
  </g>
</svg>
