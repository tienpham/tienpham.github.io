<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400">
  <defs>
    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dbGradC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#336791;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#264d73;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="workerGradC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <filter id="shadowC" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowC" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="850" height="400" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="425" y="30" text-anchor="middle" fill="#1e293b" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Cooperative Job Cancellation Flow</text>
  
  <!-- Components -->
  
  <!-- Admin/API -->
  <g transform="translate(50, 70)">
    <rect width="120" height="50" rx="8" fill="url(#apiGrad)" filter="url(#shadowC)"/>
    <text x="60" y="30" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Admin API</text>
  </g>
  
  <!-- PostgreSQL -->
  <g transform="translate(280, 70)">
    <rect width="140" height="50" rx="8" fill="url(#dbGradC)" filter="url(#shadowC)"/>
    <text x="70" y="30" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="13" font-weight="600">PostgreSQL</text>
  </g>
  
  <!-- Worker -->
  <g transform="translate(530, 70)">
    <rect width="120" height="50" rx="8" fill="url(#workerGradC)" filter="url(#shadowC)"/>
    <text x="60" y="30" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Worker</text>
  </g>
  
  <!-- Handler -->
  <g transform="translate(700, 70)">
    <rect width="120" height="50" rx="8" fill="#8b5cf6" filter="url(#shadowC)"/>
    <text x="60" y="30" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Job Handler</text>
  </g>
  
  <!-- Step 1: Cancel request -->
  <g transform="translate(50, 145)">
    <rect width="380" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="20" y="17" fill="#1e40af" font-family="system-ui, sans-serif" font-size="11" font-weight="600">1. Cancel Request</text>
    <text x="20" y="32" fill="#3b82f6" font-family="ui-monospace, monospace" font-size="10">UPDATE jobs SET status = 'cancelled' WHERE id = ?</text>
    
    <line x1="170" y1="-20" x2="280" y2="-20" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowC)"/>
  </g>
  
  <!-- Step 2: Heartbeat response -->
  <g transform="translate(280, 200)">
    <rect width="370" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="20" y="17" fill="#92400e" font-family="system-ui, sans-serif" font-size="11" font-weight="600">2. Heartbeat Returns 'cancelled'</text>
    <text x="20" y="32" fill="#a16207" font-family="ui-monospace, monospace" font-size="10">heartbeat() → Some(JobStatus::Cancelled)</text>
    
    <line x1="140" y1="-15" x2="310" y2="-15" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowC)"/>
  </g>
  
  <!-- Step 3: Signal cancellation token -->
  <g transform="translate(530, 255)">
    <rect width="290" height="40" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="20" y="17" fill="#991b1b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">3. Signal Cancellation Token</text>
    <text x="20" y="32" fill="#dc2626" font-family="ui-monospace, monospace" font-size="10">cancel_token.cancel()</text>
    
    <line x1="60" y1="-15" x2="230" y2="-15" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowC)"/>
  </g>
  
  <!-- Step 4: Handler checks -->
  <g transform="translate(530, 310)">
    <rect width="290" height="55" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
    <text x="20" y="17" fill="#166534" font-family="system-ui, sans-serif" font-size="11" font-weight="600">4. Handler Detects & Exits</text>
    <text x="20" y="35" fill="#16a34a" font-family="ui-monospace, monospace" font-size="10">if ctx.is_cancelled() {</text>
    <text x="20" y="48" fill="#16a34a" font-family="ui-monospace, monospace" font-size="10">    return Ok(());  // Clean exit</text>
    
    <line x1="230" y1="-18" x2="230" y2="-35" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowC)"/>
  </g>
  
  <!-- Timeline visual -->
  <g transform="translate(30, 145)">
    <text y="20" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">t₁</text>
    <text y="75" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">t₂</text>
    <text y="130" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">t₃</text>
    <text y="185" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">t₄</text>
  </g>
  
  <!-- Key insight box -->
  <g transform="translate(50, 285)">
    <rect width="230" height="80" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadowC)"/>
    <text x="115" y="25" text-anchor="middle" fill="#1e40af" font-family="system-ui, sans-serif" font-size="12" font-weight="600">💡 Cooperative Pattern</text>
    <text x="115" y="47" text-anchor="middle" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="10">Handler must periodically check</text>
    <text x="115" y="62" text-anchor="middle" fill="#3b82f6" font-family="ui-monospace, monospace" font-size="10">ctx.is_cancelled()</text>
  </g>
</svg>
